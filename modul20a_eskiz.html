<script>
var MODULE_INTRO = {
  title: "🧠 20-Modul (1-qism) haqida",
  text: "Bu — Deep Learning (Chuqur o'qitish) moduli, 4 qismdan iborat: 20a (Asoslar), 20b (CNN/RNN), 20c (NLP/Transformer), 20d (Amaliyot/Deployment).\n\nUshbu 1-qismda Perceptron, aktivlashtirish funksiyalari, yo'qotish funksiyasi, birinchi neyron tarmoq kodini yozish, va Overfitting/Giperparametrlarni o'rganasiz — bu butun Deep Learning ning poydevori.",
  count: 21
};

var M = [

{id:'20.1', type:'test',
 title:'Kirish',
 terms:[
   ['Deep Learning','Ko\'p qatlamli neyron tarmoqlar asosidagi Machine Learning sohasi'],
   ['Neyron tarmoq (Neural Network)','Inson miyasi ishlashidan ilhomlangan hisoblash modeli'],
   ['Qatlam (Layer)','Neyronlar guruhlangan bosqich'],
   ['Modul 20 tarkibi','Asoslar → CNN/RNN → NLP/Transformer → Amaliyot/Deployment']
 ],
 detail:'DEEP LEARNING MODULIGA XUSH KELIBSIZ\n\n14-20 modullarda siz klassik Machine Learning (Linear Regression, k-NN, Decision Tree, Random Forest) ni o\'rgandingiz. Bu modullarda model siz uchun xususiyatlarni (feature) qo\'lda tanlashingizni talab qiladi.\n\nDEEP LEARNING FARQI: Deep Learning — ko\'p qatlamli neyron tarmoqlardan iborat usul, u xususiyatlarni AVTOMATIK ravishda, ma\'lumotning o\'zidan o\'rganadi. Ayniqsa rasm, matn, ovoz kabi murakkab, struktura aniq bo\'lmagan ma\'lumotlarda kuchli.\n\nMODUL TARKIBI: Bu modul 4 qismdan iborat: (1) Asoslar — Perceptron, aktivlashtirish, yo\'qotish funksiyasi, birinchi kod; (2) CNN/RNN — rasm va ketma-ketlik uchun maxsus arxitekturalar; (3) NLP/Transformer — zamonaviy til modellari; (4) Amaliyot/Deployment — Hugging Face, fine-tuning, real loyihaga chiqarish.\n\nNEGA BU TARTIBDA? Har bir keyingi tushuncha avvalgisiga asoslanadi — Perceptron tushunilmasa, ko\'p qatlamli tarmoqni, u tushunilmasa CNN/RNN ni, ular tushunilmasa Transformer ni tushunish qiyin bo\'ladi.',
 tests:[
   {q:'Klassik Machine Learning va Deep Learning orasidagi asosiy farq nima?',
    opts:['Deep Learning faqat matn bilan ishlaydi','Deep Learning xususiyatlarni avtomatik o\'rganadi, klassik ML da inson tanlaydi','Klassik ML har doim aniqroq','Ular bir xil narsa'],
    ans:1,
    exp:'Klassik ML da feature engineering (xususiyat tanlash) ko\'pincha inson tomonidan qilinadi, Deep Learning esa bu jarayonni ma\'lumotning o\'zidan avtomatik o\'rganadi.'},
   {q:'Deep Learning ayniqsa qaysi turdagi ma\'lumotlarda kuchli?',
    opts:['Faqat jadval (table) ma\'lumotlarda','Rasm, matn, ovoz kabi murakkab ma\'lumotlarda','Faqat kichik datasetlarda','Hech qaysi birida ustunlik qilmaydi'],
    ans:1,
    exp:'Deep Learning rasm, matn, ovoz kabi struktura aniq bo\'lmagan, murakkab ma\'lumotlarda ayniqsa kuchli natija beradi.'},
   {q:'Bu modul (20-modul) nechta asosiy qismdan iborat?',
    opts:['2','3','4','5'],
    ans:2,
    exp:'Modul 4 qismdan iborat: Asoslar, CNN/RNN, NLP/Transformer, Amaliyot/Deployment.'}
 ]},

{id:'20.2', type:'test',
 title:'Chuqur o\'qitish nima?',
 terms:[
   ['Chuqur o\'qitish (Deep Learning)','Ko\'p (odatda 3 dan ortiq) qatlamli neyron tarmoqlar bilan o\'qitish'],
   ['Shallow Network','Kam qatlamli (1-2 qatlam) oddiy neyron tarmoq'],
   ['Hierarchical Feature Learning','Har bir qatlam avvalgisidan murakkabroq naqsh o\'rganishi'],
   ['Representation Learning','Ma\'lumotning foydali ichki tasvirini avtomatik topish']
 ],
 detail:'"CHUQUR" SO\'ZI NIMANI BILDIRADI?\n\n"Chuqur" (deep) so\'zi — tarmoqdagi QATLAMLAR sonini bildiradi. Oddiy ("shallow") neyron tarmoqda 1-2 qatlam bo\'ladi, Deep Learning esa o\'nlab, yuzlab, ba\'zan minglab qatlamlardan iborat bo\'lishi mumkin.\n\nHIERARCHICAL FEATURE LEARNING: Har bir qatlam avvalgisidan murakkabroq naqshni o\'rganadi. Masalan rasm tanishda: birinchi qatlamlar — chiziq va burchaklarni, o\'rta qatlamlar — shakl va teksturalarni, oxirgi qatlamlar — to\'liq obyektlarni (yuz, mashina) aniqlaydi. Bu — REPRESENTATION LEARNING deyiladi: model ma\'lumotning eng foydali ichki tasvirini o\'zi topadi, inson buni qo\'lda dasturlashtirishi shart emas.\n\nMISOL: An\'anaviy rasm tanishda, inson dasturchi "qulaylik aniqlovchi" yoki "burchak aniqlovchi" algoritmlarni qo\'lda yozishi kerak edi. Deep Learning da, tarmoqning o\'zi minglab rasmlarni ko\'rib, qaysi naqshlar foydali ekanini avtomatik topadi.',
 tests:[
   {q:'"Chuqur" (deep) so\'zi Deep Learning da nimani bildiradi?',
    opts:['Modelning aniqligi yuqori ekanini','Tarmoqdagi qatlamlar ko\'p ekanini','Ma\'lumot hajmi katta ekanini','Modelni tushunish qiyin ekanini'],
    ans:1,
    exp:'"Chuqur" — tarmoqda ko\'p qatlam borligini bildiradi, bu modelning murakkab naqshlarni bosqichma-bosqich o\'rganish imkonini beradi.'},
   {q:'Hierarchical Feature Learning da rasm tanishda birinchi qatlamlar odatda nimani aniqlaydi?',
    opts:['To\'liq obyektlarni (masalan yuz)','Oddiy chiziq va burchaklarni','Matn ma\'nosini','Ovoz balandligini'],
    ans:1,
    exp:'Birinchi qatlamlar eng sodda naqshlarni (chiziq, burchak) aniqlaydi, keyingi qatlamlar bulardan murakkabroq shakllarni quradi.'},
   {q:'Representation Learning nima?',
    opts:['Ma\'lumotni qo\'lda belgilash','Modelning ma\'lumot ichki tasvirini avtomatik topishi','Faqat rasm formatini o\'zgartirish','Modelni tezlashtirish usuli'],
    ans:1,
    exp:'Representation Learning — model ma\'lumotning eng foydali ichki tasvirini (qaysi xususiyatlar muhim ekanini) o\'zi, avtomatik o\'rganishi.'}
 ]},

{id:'20.3', type:'test',
 title:'Nega chuqur o\'qitish trendda?',
 terms:[
   ['Big Data','Internet va raqamli qurilmalar orqali to\'plangan ulkan ma\'lumot hajmi'],
   ['GPU (Graphics Processing Unit)','Parallel hisoblashga mos protsessor, DL ni tezlashtiradi'],
   ['ImageNet momenti','2012-yilda CNN ning rasm tanishda inqilob qilgan voqeasi'],
   ['Transfer Learning','Oldindan o\'qitilgan modeldan foydalanish imkoniyati']
 ],
 detail:'NEGA AYNI HOZIR DEEP LEARNING GULLAB-YASHNAYAPTI?\n\nDeep Learning g\'oyalari aslida 1980-yillardan beri mavjud edi, lekin amalda keng qo\'llanilishi uchun UCH OMIL kerak bo\'ldi:\n\n1. BIG DATA: Internet, smartfonlar, ijtimoiy tarmoqlar tufayli rasm, matn, ovoz ma\'lumotlari ulkan hajmda mavjud bo\'ldi. Neyron tarmoqlar yaxshi ishlashi uchun KO\'P ma\'lumot kerak.\n\n2. GPU: Grafik protsessorlar (GPU) asli video o\'yinlar uchun yaratilgan, lekin ular matritsa amallarini parallel (bir vaqtda ko\'plab) bajarish uchun ajoyib mos keladi — bu aynan neyron tarmoq hisoblashlarining tabiati. Bu DL ni o\'qitishni necha o\'n marta tezlashtirdi.\n\n3. ALGORITM YUTUQLARI: 2012-yilda ImageNet musobaqasida CNN arxitekturasi (AlexNet) boshqa usullarni katta farq bilan ortda qoldirdi — bu "ImageNet momenti" Deep Learning ga umumjahon e\'tiborni qaratdi.\n\nTRANSFER LEARNING: Bugungi kunda, katta kompaniyalar (Google, OpenAI, Meta) ulkan ma\'lumot va hisoblash kuchi bilan modellarni oldindan o\'qitib, ularni OCHIQ qiladi (masalan Hugging Face orqali). Endi har kim ulardan FOYDALANISHI mumkin, noldan o\'qitish shart emas — bu modul oxirida (20d qismda) batafsil ko\'riladi.',
 tests:[
   {q:'Deep Learning ning keng qo\'llanilishi uchun qaysi uch omil hal qiluvchi bo\'ldi?',
    opts:['Faqat internet tezligi','Big Data, GPU va algoritm yutuqlari','Faqat narx pasayishi','Faqat universitet tadqiqotlari'],
    ans:1,
    exp:'Ulkan ma\'lumot hajmi (Big Data), tezkor parallel hisoblash (GPU), va algoritm yutuqlari (masalan CNN) birgalikda Deep Learning ni amaliy qildi.'},
   {q:'GPU nima uchun Deep Learning uchun ayniqsa mos keladi?',
    opts:['U arzonroq','U matritsa amallarini parallel bajarishga mos','U faqat o\'yinlar uchun ishlatiladi','U internetga ulanish kerak emas'],
    ans:1,

{id:'20.6', type:'test',
 title:'Neyron tarmoqlari o\'rganishi',
 terms:[
   ['O\'rganish (Learning)','Tarmoq xato asosida og\'irliklarni yaxshilab borishi'],
   ['Og\'irlik (Weight)','Har bir bog\'lanishning kuchini bildiruvchi son'],
   ['Iteratsiya (Epoch)','Butun ma\'lumot to\'plamidan bir marta o\'tish'],
   ['Yaqinlashish (Convergence)','Tarmoq xatosi kamayib, barqarorlashishi']
 ],
 detail:'NEYRON TARMOQ QANDAY "O\'RGANADI"?\n\nNeyron tarmoq "o\'rganishi" — aslida OG\'IRLIKLARNI (weights) asta-sekin yaxshilab borish jarayoni. Boshida og\'irliklar tasodifiy qiymatlarga ega bo\'ladi (tarmoq hali "bilmaydi"), va o\'qitish davomida ular xatoni kamaytiradigan tomonga siljiydi.\n\nUMUMIY JARAYON: (1) Ma\'lumot tarmoqqa beriladi → bashorat chiqadi; (2) Bashorat haqiqiy javob bilan solishtiriladi → xato hisoblanadi; (3) Xato asosida og\'irliklar ozgina TUZATILADI; (4) Bu jarayon minglab marta takrorlanadi, har safar ozgina yaxshilanib boradi.\n\nEPOCH NIMA? Bir EPOCH — butun train ma\'lumot to\'plamidan bir marta to\'liq o\'tish. Odatda tarmoq bir necha (10, 50, 100) epoch davomida o\'qitiladi — har bir epoch da xato kamayib boradi, toki YAQINLASHISH (convergence) ro\'y berguncha — bu yerda xato deyarli o\'zgarmay qoladi, demak tarmoq imkon qadar yaxshi natijaga yetdi.',
 tests:[
   {q:'Neyron tarmoq "o\'rganishi" aslida nimani anglatadi?',
    opts:['Yangi neyron qo\'shilishini','Og\'irliklarning xato asosida asta-sekin tuzatilishini','Ma\'lumotning o\'chirilishini','Kod tilining o\'zgarishini'],
    ans:1,
    exp:'O\'rganish — og\'irliklarning (weights) xato signali asosida iterativ ravishda yaxshilab borilishi jarayoni.'},
   {q:'Bir Epoch nimani bildiradi?',
    opts:['Bitta neyronni o\'qitish','Butun train ma\'lumotidan bir marta to\'liq o\'tish','Modelni butunlay qayta yaratish','Faqat bitta savolga javob berish'],
    ans:1,
    exp:'Bir Epoch — tarmoq butun train ma\'lumot to\'plamini bir marta to\'liq ko\'rib chiqishi.'},
   {q:'Yaqinlashish (Convergence) qachon ro\'y beradi?',
    opts:['O\'qitish boshlanganda darhol','Xato deyarli o\'zgarmay, barqarorlashganda','Ma\'lumot o\'chirilganda','Faqat 1 epochdan keyin doim'],
    ans:1,
    exp:'Convergence — xato kamayib, keyingi epochlarda deyarli o\'zgarmay qolgan holat, bu tarmoq imkon qadar yaxshi natijaga yetganini bildiradi.'}
 ]},

{id:'20.7', type:'test',
 title:'Perseptron nima?',
 terms:[
   ['Perseptron','Eng sodda neyron tarmoq birligi — bitta "sun\'iy neyron"'],
   ['Kirish (Input)','Perseptronga beriladigan x1, x2, ... qiymatlar'],
   ['Og\'irlik va Bias','Har bir kirish uchun og\'irlik (w) va qo\'shimcha bias (b)'],
   ['Aktivlashtirish (Activation)','Yig\'indini yakuniy chiqishga aylantiruvchi qadam']
 ],
 detail:'PERSEPTRON — DEEP LEARNING NING "G\'ISHTI"\n\nPerseptron — 1958-yilda yaratilgan, eng sodda sun\'iy neyron modeli. Har bir murakkab neyron tarmoq, aslida, ko\'plab perseptronlardan (neyronlardan) tashkil topgan.\n\nPERSEPTRON QANDAY ISHLAYDI?\n1. Bir necha kirish qiymati keladi: x1, x2, x3...\n2. Har biriga o\'z OG\'IRLIGI (w1, w2, w3...) ko\'paytiriladi\n3. Natijalar yig\'iladi, va qo\'shimcha BIAS (b) qo\'shiladi: z = w1*x1 + w2*x2 + ... + b\n4. Yig\'indi AKTIVLASHTIRISH FUNKSIYASI orqali o\'tkaziladi, yakuniy chiqish hosil bo\'ladi\n\nBU TANISH KO\'RINADI! Diqqat qiling: z = w1*x1+w2*x2+...+b formulasi 16-modulda o\'rgangan Multiple Linear Regression formulasiga JUDA O\'XSHASH! Farqi — Perseptronda natija qo\'shimcha aktivlashtirish funksiyasidan o\'tadi (20.9-20.10 da batafsil), bu uni nochiziqli (non-linear) qaror qabul qila olishga imkon beradi.\n\nNEGA BU MUHIM? Bitta Perseptron — oddiy chiziqli ajratish qila oladi (Logistic Regression ga o\'xshash). Lekin KO\'P Perseptronni qatlamlarga birlashtirsangiz (Multi-Layer Network), tarmoq juda murakkab, egri chegaralarni ham o\'rganishga qodir bo\'ladi.',
 tests:[
   {q:'Perseptron formulasi z = w1*x1 + w2*x2 + ... + b qaysi modul formulasiga o\'xshash?',
    opts:['k-NN','Multiple Linear Regression','Decision Tree','K-Means'],
    ans:1,
    exp:'Bu formula 16-moduldagi Multiple Linear Regression formulasiga (y=w1x1+w2x2+...+b) juda o\'xshash — farqi keyin aktivlashtirish funksiyasi qo\'llanadi.'},
   {q:'Perseptronda "bias" (b) nima vazifani bajaradi?',
    opts:['Kirish qiymatlarini ko\'paytiradi','Yig\'indiga qo\'shimcha doimiy qiymat qo\'shadi','Aktivlashtirish funksiyasini o\'chiradi','Faqat test rejimida ishlaydi'],
    ans:1,
    exp:'Bias — og\'irliklangan yig\'indiga qo\'shiladigan qo\'shimcha doimiy qiymat, bu modelga ko\'proq moslashuvchanlik beradi.'},
   {q:'Bitta Perseptron nima qila oladi?',
    opts:['Faqat murakkab egri chegaralarni ajratishni','Oddiy chiziqli ajratishni (Logistic Regression ga o\'xshash)','Rasm tanishni mukammal','Hech narsa qila olmaydi'],
    ans:1,
    exp:'Bitta Perseptron — chiziqli ajratish qila oladi. Murakkab, egri chegaralar uchun ko\'p Perseptronni qatlamlarga birlashtirish kerak.'}
 ]},

{id:'20.9', type:'test',
 title:'Aktivlashtirish funksiyasi (1-qism)',
 terms:[
   ['Aktivlashtirish funksiyasi','Neyron chiqishini nochiziqli qiluvchi funksiya'],
   ['Nochiziqlilik (Non-linearity)','Tarmoqqa murakkab naqshlarni o\'rganish qobiliyatini beruvchi xususiyat'],
   ['Sigmoid','Natijani 0 va 1 orasiga siquvchi aktivlashtirish funksiyasi'],
   ['Tanh','Natijani -1 va 1 orasiga siquvchi aktivlashtirish funksiyasi']
 ],
 detail:'NEGA AKTIVLASHTIRISH FUNKSIYASI KERAK?\n\nAgar Perseptronlar faqat chiziqli formula (w*x+b) bilan cheklansa, hattoki YUZLAB qatlamni ustma-ust qo\'ysangiz ham, natija baribir CHIZIQLI bo\'lib qoladi (chiziqli funksiyalar kombinatsiyasi — hali ham chiziqli). Bu esa tarmoqning real dunyodagi murakkab, egri naqshlarni o\'rganishiga to\'sqinlik qiladi.\n\nYECHIM — AKTIVLASHTIRISH FUNKSIYASI: Har bir neyron chiqishidan keyin NOCHIZIQLI funksiya qo\'llaniladi. Bu tarmoqqa "egrilik" qo\'shadi — endi ko\'p qatlamni birlashtirish HAQIQATAN murakkabroq, egri qaror chegaralarini hosil qiladi.\n\nSIGMOID: Formula 1/(1+e^-z). Natijani 0 va 1 orasiga "siqadi" — 17-moduldagi Logistic Regression da ko\'rgan xuddi shu funksiya! Foydali ehtimollik talab qilinganda (masalan yakuniy chiqish qatlamida, binary classification uchun).\n\nTANH: Sigmoid ga o\'xshash, lekin natijani -1 va 1 orasiga siqadi (markazi 0 da). Ko\'pincha sigmoid dan biroz yaxshiroq ishlaydi, chunki uning chiqishi markazlashgan (zero-centered), bu o\'qitishni biroz barqarorlashtiradi.\n\nIKKISINING KAMCHILIGI: Katta yoki kichik z qiymatlarida, ikkisining grafigi "tekislashadi" (gradient deyarli 0 bo\'lib qoladi) — bu "vanishing gradient" muammosiga olib keladi, chuqur tarmoqlarda o\'qitishni qiyinlashtiradi. Bu muammo 20.10 da ko\'riladigan ReLU orqali asosan hal qilinadi.',
 tests:[
   {q:'Agar aktivlashtirish funksiyasi bo\'lmasa, ko\'p qatlamli tarmoq nima bo\'lib qoladi?',
    opts:['Avtomatik tezlashadi','Baribir chiziqli model bo\'lib qoladi','Xato qaytaradi','Hech narsa o\'zgarmaydi'],
    ans:1,
    exp:'Aktivlashtirish funksiyasisiz, chiziqli funksiyalar kombinatsiyasi hali ham chiziqli bo\'lib qoladi — tarmoq murakkab naqshlarni o\'rgana olmaydi.'},
   {q:'Sigmoid funksiyasi natijani qaysi oraliqqa siqadi?',
    opts:['-1 dan 1 gacha','0 dan 1 gacha','-∞ dan +∞ gacha','0 dan 100 gacha'],
    ans:1,
    exp:'Sigmoid natijani 0 va 1 orasiga siqadi — bu ehtimollik sifatida talqin qilish uchun foydali.'},
   {q:'Sigmoid va Tanh ning umumiy kamchiligi nima?',
    opts:['Ular juda tez hisoblanadi','Katta/kichik qiymatlarda gradient deyarli 0 ga aylanadi (vanishing gradient)','Ular faqat rasm bilan ishlaydi','Ular hech qachon ishlatilmaydi'],
    ans:1,
    exp:'Ikkisi ham ekstremal qiymatlarda "tekislashadi" — gradient deyarli yo\'qoladi, bu chuqur tarmoqlarda o\'qitishni qiyinlashtiradi (vanishing gradient muammosi).'}
 ]},

{id:'20.10', type:'test',
 title:'Aktivlashtirish funksiyasi (2-qism)',
 terms:[
   ['ReLU (Rectified Linear Unit)','max(0, z) formulali, eng ko\'p ishlatiladigan aktivlashtirish funksiyasi'],
   ['Vanishing Gradient','Chuqur tarmoqlarda gradientning deyarli yo\'qolib qolishi muammosi'],
   ['Softmax','Ko\'p toifali klassifikatsiya uchun ehtimolliklar taqsimotini chiqaruvchi funksiya'],
   ['Qaysi qatlamda qaysi funksiya','Yashirin qatlamlarda ReLU, chiqish qatlamida vazifaga mos funksiya']
 ],
 detail:'RELU — ZAMONAVIY STANDART\n\nReLU formulasi juda sodda: f(z) = max(0, z) — agar z manfiy bo\'lsa, natija 0; agar musbat bo\'lsa, natija aynan z ning o\'zi.\n\nNEGA RELU SHUNCHALIK MASHHUR? (1) Hisoblash JUDA tez (faqat solishtirish, murakkab eksponensial yo\'q); (2) Musbat qiymatlarda gradient hech qachon "tekislashmaydi" (vanishing gradient muammosi sezilarli kamayadi); (3) Amalda chuqur tarmoqlarni Sigmoid/Tanh ga qaraganda ancha tezroq va barqarorroq o\'qitadi.\n\nQAYSI QATLAMDA QAYSI FUNKSIYA ISHLATILADI? YASHIRIN (hidden) qatlamlarda — deyarli har doim ReLU (yoki uning variantlari) ishlatiladi. CHIQISH (output) qatlamida — vazifaga bog\'liq: Binary Classification uchun Sigmoid (0-1 ehtimollik), Multiclass Classification uchun SOFTMAX, Regression uchun aktivlashtirish funksiyasi UMUMAN ishlatilmaydi (xom raqamli qiymat kerak).\n\nSOFTMAX NIMA? Ko\'p toifali klassifikatsiyada (masalan 10 xil raqamni tanish), Softmax barcha toifalar uchun ehtimolliklarni chiqaradi, va ularning YIG\'INDISI har doim 1 ga teng bo\'ladi (masalan [0.7, 0.1, 0.05, ..., 0.02] — eng yuqori ehtimollik yakuniy bashorat sifatida tanlanadi).',
 tests:[
   {q:'ReLU funksiyasining formulasi qanday?',
    opts:['1/(1+e^-z)','max(0, z)','(e^z - e^-z)/(e^z + e^-z)','z²'],
    ans:1,
    exp:'ReLU = max(0, z) — manfiy qiymatlarni 0 ga, musbat qiymatlarni o\'zgartirmasdan qaytaradi.'},
   {q:'ReLU nima uchun Sigmoid/Tanh dan ko\'proq ishlatiladi?',
    opts:['U faqat rasm bilan ishlaydi','Tezroq hisoblanadi va vanishing gradient muammosini kamaytiradi','U har doim 100% aniqlik beradi','U eng eski funksiya'],
    ans:1,
    exp:'ReLU hisoblash tezligi va musbat qiymatlarda gradientning "yo\'qolmasligi" tufayli chuqur tarmoqlarni samaraliroq o\'qitishga yordam beradi.'},
   {q:'Ko\'p toifali klassifikatsiyada (masalan 10 raqamni tanish) chiqish qatlamida odatda qaysi funksiya ishlatiladi?',
    opts:['ReLU','Sigmoid','Softmax','Hech qaysi funksiya kerak emas'],
    ans:2,
    exp:'Softmax — ko\'p toifa uchun ehtimolliklar taqsimotini (yig\'indisi 1 ga teng) chiqaradi, bu multiclass classification uchun mos.'}
 ]},

   {q:'Regression vazifasida chiqish qatlamida aktivlashtirish funksiyasi odatda kerak boʻladimi?',
    opts:['Ha, har doim Sigmoid kerak','Yo\'q, xom raqamli qiymat kerak bo\'lgani uchun odatda ishlatilmaydi','Faqat ReLU ishlatiladi','Faqat Softmax ishlatiladi'],
    ans:1,
    exp:'Regression da chiqish cheklanmagan raqamli qiymat bo\'lishi kerak, shuning uchun chiqish qatlamida aktivlashtirish funksiyasi odatda ishlatilmaydi.'}
 ]},

{id:'20.12', type:'test',
 title:'Yo\'qotish funksiyasi va optimallashtirish',
 terms:[
   ['Loss function (Yo\'qotish funksiyasi)','Modelning xatosini bitta son bilan o\'lchaydigan funksiya'],
   ['Gradient Descent','Xatoni kamaytirish uchun og\'irliklarni qadam-baqadam o\'zgartirish usuli'],
   ['Learning Rate','Har bir qadamda og\'irliklar qanchalik o\'zgarishini boshqaruvchi parametr'],
   ['Optimizer (masalan Adam)','Gradient Descent ni amalga oshiruvchi algoritm']
 ],
 detail:'MODEL XATOSINI QANDAY O\'LCHASH VA KAMAYTIRISH MUMKIN?\n\nLOSS FUNCTION: Bu — modelning bashorati haqiqiy javobdan qanchalik farq qilishini BITTA SON bilan o\'lchaydigan funksiya. Regression uchun ko\'pincha MSE (16-moduldan tanish), Classification uchun Cross-Entropy Loss ishlatiladi (bu — model qanchalik "ishonchli noto\'g\'ri" bo\'lganini kuchli jazolaydi).\n\nGRADIENT DESCENT: Loss ni kamaytirish uchun ishlatiladigan asosiy usul. Tasavvur qiling — siz tog\'dan tushayotgan odam, ko\'zingiz yopiq, va pastga (eng kichik loss tomon) yo\'l topishingiz kerak. Har qadamda, qaysi yo\'nalish "pastga" ekanini (gradient) his qilib, shu tomonga kichik qadam tashlaysiz. Bu jarayon minglab marta takrorlanadi.\n\nLEARNING RATE: Har bir qadam QANCHALIK katta bo\'lishini belgilaydi. Juda KATTA learning rate — qadamlar haddan katta, model "sakraydi", hech qachon eng pastga yetib bormaydi. Juda KICHIK learning rate — o\'qitish juda sekin boradi, ko\'p vaqt talab qiladi.\n\nOPTIMIZER: Gradient Descent ning sodda versiyasi (SGD) dan tashqari, zamonaviy optimizerlar (eng mashhuri — ADAM) qo\'shimcha "aqlli" hisob-kitoblar bilan o\'qitishni tezlashtiradi va barqarorlashtiradi. Amalda, deyarli har doim Adam optimizer standart tanlov hisoblanadi.',
 tests:[
   {q:'Loss function nima vazifani bajaradi?',
    opts:['Ma\'lumotni tozalaydi','Modelning xatosini bitta son bilan o\'lchaydi','Modelni tezlashtiradi','Yangi xususiyat yaratadi'],
    ans:1,
    exp:'Loss function — bashorat va haqiqiy javob orasidagi farqni bitta son bilan o\'lchaydi, bu o\'qitish jarayonida minimallashtirilishi kerak.'},
   {q:'Learning Rate juda katta bo\'lsa, nima bo\'ladi?',
    opts:['O\'qitish juda tez va aniq bo\'ladi','Qadamlar haddan katta bo\'lib, model "sakraydi" va yaxshi yaqinlasha olmaydi','Hech qanday farq bo\'lmaydi','Model darhol 100% aniqlikka erishadi'],
    ans:1,
    exp:'Juda katta learning rate qadamlarni haddan tashqari kattalashtiradi — model eng kichik loss nuqtasini "sakrab o\'tib ketishi" mumkin.'},
   {q:'Adam nima?',
    opts:['Aktivlashtirish funksiyasi turi','Mashhur, aqlli optimizer algoritmi','Loss function turi','Dataset nomi'],
    ans:1,
    exp:'Adam — Gradient Descent ning zamonaviy, samarali versiyasi, deyarli barcha Deep Learning loyihalarida standart tanlov sifatida ishlatiladi.'}
 ]},

{id:'20.14', type:'test',
 title:'Oddiy neyrondan butun tarmoqqacha',
 terms:[
   ['Multi-Layer Network (Ko\'p qatlamli tarmoq)','Bir nechta neyron qatlamidan tashkil topgan tarmoq'],
   ['Input Layer','Ma\'lumot kiradigan birinchi qatlam'],
   ['Hidden Layer (Yashirin qatlam)','Kirish va chiqish orasidagi qatlam(lar)'],
   ['Output Layer','Yakuniy bashoratni chiqaradigan oxirgi qatlam']
 ],
 detail:'BITTA NEYRONDAN TO\'LIQ TARMOQQACHA\n\n20.7 da bitta Perseptron — chiziqli ajratishdan boshqa narsa qila olmasligini ko\'rdik. Haqiqiy kuch — bir nechta neyronni QATLAMLARGA birlashtirishda.\n\nUCH ASOSIY QATLAM TURI:\n1. INPUT LAYER — ma\'lumot shu yerdan kiradi (masalan rasm piksellari, yoki jadval xususiyatlari). Bu qatlam hisoblash qilmaydi, faqat ma\'lumotni qabul qiladi.\n2. HIDDEN LAYER(LAR) — bu yerda haqiqiy "fikrlash" sodir bo\'ladi. Har bir hidden qatlam, avvalgi qatlamdan kelgan ma\'lumotni og\'irlik+bias+aktivlashtirish orqali qayta ishlaydi. "Deep" (chuqur) so\'zi — ko\'p hidden qatlam borligini bildiradi.\n3. OUTPUT LAYER — yakuniy bashoratni chiqaradi (masalan bitta son regression uchun, yoki bir nechta ehtimollik classification uchun).\n\nFEEDFORWARD: Ma\'lumot INPUT dan OUTPUT ga tomon, faqat OLDINGA oqadi (shuning uchun "Feedforward Neural Network" deyiladi) — bu eng sodda arxitektura turi, CNN va RNN (20b qismda) bundan farqli, maxsus ulanish naqshlariga ega.\n\nFULLY CONNECTED (DENSE): Oddiy ko\'p qatlamli tarmoqda, har bir qatlamdagi HAR BIR neyron, keyingi qatlamdagi HAR BIR neyron bilan bog\'langan — shuning uchun bu qatlamlar "Dense" (Keras da shunday nomlanadi) yoki "Fully Connected" deyiladi.',
 tests:[
   {q:'Hidden Layer qaysi vazifani bajaradi?',
    opts:['Faqat ma\'lumotni qabul qiladi, hisoblamaydi','Kirish va chiqish orasida haqiqiy "fikrlash" (qayta ishlash) sodir bo\'ladigan qatlam','Faqat yakuniy javobni chiqaradi','Hech qanday vazifa bajarmaydi'],
    ans:1,
    exp:'Hidden Layer(lar) — ma\'lumotni og\'irlik, bias va aktivlashtirish orqali qayta ishlaydigan, haqiqiy hisoblash sodir bo\'ladigan qatlamlar.'},
   {q:'"Deep" (chuqur) so\'zi tarmoq tuzilishida nimani bildiradi?',
    opts:['Ko\'p Input Layer borligini','Ko\'p Hidden Layer borligini','Ko\'p Output Layer borligini','Hech narsani bildirmaydi'],
    ans:1,
    exp:'"Deep" — ko\'p Hidden Layer (yashirin qatlam) borligini bildiradi, bu tarmoqqa murakkab naqshlarni bosqichma-bosqich o\'rganish imkonini beradi.'},
   {q:'"Fully Connected" (Dense) qatlam nimani anglatadi?',
    opts:['Faqat bir nechta neyron bog\'langan','Har bir neyron keyingi qatlamdagi har bir neyron bilan bog\'langan','Hech qanday bog\'lanish yo\'q','Faqat oxirgi qatlamga tegishli'],
    ans:1,
    exp:'Fully Connected (Dense) qatlamda, bir qatlamdagi har bir neyron, keyingi qatlamdagi BARCHA neyronlar bilan bog\'langan.'}
 ]},

 title:'5-test',
 terms:[
   ['Qisqa nazorat','20.14 tarmoq strukturasini mustahkamlovchi tekshiruv'],
   ['Input/Hidden/Output Layer','Tarmoqning uch asosiy qatlam turi'],
   ['Feedforward','Ma\'lumot faqat oldinga oqadigan oddiy arxitektura'],
   ['Dense (Fully Connected)','Har bir neyron keyingisi bilan to\'liq bog\'langan qatlam turi']
 ],
 detail:'QISQA NAZORAT — 20.14\n\nBu nazorat ko\'p qatlamli tarmoq strukturasini (Input, Hidden, Output Layer) va Dense/Feedforward tushunchalarini mustahkamlaydi.\n\nESLATMA: Input Layer ma\'lumotni qabul qiladi, Hidden Layer(lar) qayta ishlaydi, Output Layer yakuniy javobni beradi. Oddiy tarmoqda barcha qatlamlar "Dense" (to\'liq bog\'langan) bo\'ladi.',
 tests:[
   {q:'Output Layer qanday vazifani bajaradi?',
    opts:['Ma\'lumotni qabul qiladi','Yakuniy bashoratni chiqaradi','Hech narsa qilmaydi','Faqat ma\'lumotni saqlaydi'],
    ans:1,
    exp:'Output Layer — barcha hidden qatlamlardan o\'tgan ma\'lumot asosida yakuniy bashoratni chiqaradigan oxirgi qatlam.'},
   {q:'"Feedforward" nima degani?',
    opts:['Ma\'lumot orqaga qaytadi','Ma\'lumot faqat oldinga (input dan outputga) oqadi','Ma\'lumot tasodifiy yo\'nalishda harakatlanadi','Hech qanday ma\'lumot oqimi yo\'q'],
    ans:1,
    exp:'Feedforward arxitekturada ma\'lumot faqat bir yo\'nalishda — Input dan Output ga tomon oqadi.'},
   {q:'Agar tarmoqda faqat Input va Output Layer bo\'lsa (hidden qatlamsiz), bu nima bo\'ladi?',
    opts:['Eng kuchli Deep Learning modeli','Aslida shunchaki Perseptron/chiziqli model darajasida bo\'ladi','Har doim 100% aniqlik beradi','Bu mumkin emas'],
    ans:1,
    exp:'Hidden qatlamsiz, tarmoq murakkab naqshlarni o\'rgana olmaydi — u aslida sodda chiziqli model (Perseptron) darajasida qoladi.'}
 ]},

{id:'20.16', type:'eskiz',

 terms:[
   ['keras.Sequential()','Qatlamlarni ketma-ket joylashtirib model yaratish usuli'],

 ],

  {q:'Modelga yakuniy (output) Dense qatlamni qo\'shib, yopib, summary chiqaring.',
   lines:[
    {c:'    keras.layers.Dense(1)',n:'Siz 1 neyronli output qatlamni qo\'shdingiz (regression uchun)'},

    {c:'model.summary()',n:'Siz model strukturasini ekranga chiqardingiz'},
   ]},
 ]},

{id:'20.17', type:'eskiz',
 title:'Neyron tarmoqlariga kod o\'rgatamiz (2-qism)',
 terms:[
   ['.compile()','Modelga optimizer, loss va metrikalarni belgilash metodi'],
   ['.fit(X, y, epochs=...)','Modelni ma\'lumotga o\'qitish metodi'],
   ['optimizer=\'adam\'','Adam optimizerini tanlash'],
   ['loss=\'mse\'','Regression uchun MSE yo\'qotish funksiyasini tanlash']
 ],
 detail:'MODELNI O\'QITISH — COMPILE VA FIT\n\n20.16 da model STRUKTURASINI yaratdik, lekin u hali "o\'qitishga tayyor" emas — avval QANDAY o\'qitilishini belgilash kerak.\n\n.COMPILE(): model.compile(optimizer=\'adam\', loss=\'mse\') — bu yerda optimizer (20.12 dan tanish — Adam), va loss function (regression uchun MSE) belgilanadi. Bu — modelga "qanday xato qilishingni o\'lchaymiz va qanday tuzataman" qoidalarini aytish.\n\n.FIT(): model.fit(X, y, epochs=50) — bu metod haqiqiy o\'qitish jarayonini boshlaydi. epochs — necha marta butun ma\'lumotdan o\'tilishini belgilaydi (20.6 dan tanish tushuncha). Har epoch da, Keras loss qiymatini ko\'rsatadi — bu kamayib borishi kerak, agar model to\'g\'ri o\'qitilayotgan bo\'lsa.',
 sim:'>>> model.compile(optimizer=\'adam\', loss=\'mse\')\n>>> model.fit(X, y, epochs=50)\nEpoch 1/50\nloss: 12.450\nEpoch 50/50\nloss: 0.832',
 eskizlar:[
  {q:'Modelni compile qiling — Adam optimizer va MSE loss bilan.',
   lines:[
    {c:'model.compile(',n:'Siz modelni compile qilishni boshladingiz'},
    {c:'    optimizer=\'adam\',',n:'Siz Adam optimizerini tanladingiz'},
    {c:'    loss=\'mse\')',n:'Siz MSE yo\'qotish funksiyasini tanladingiz'},
   ]},
  {q:'fit() metodi bilan modelni 50 epoch davomida o\'qiting.',
   lines:[
    {c:'natija = model.fit(X, y, epochs=50)',n:'Siz modelni 50 epoch davomida o\'qitdingiz'},
    {c:'',n:'Bo\'sh qator'},
    {c:'print(\'O\\\'qitish tugadi\')',n:'Siz o\'qitish tugaganini bildiruvchi xabar chiqardingiz'},
   ]},
 ]},

{id:'20.18', type:'eskiz',
 title:'1-amaliy vazifa',
 terms:[
   ['To\'liq Keras workflow','Model qurishdan o\'qitishgacha bo\'lgan barcha qadamlar'],
   ['.predict()','O\'qitilgan model bilan yangi ma\'lumot uchun bashorat qilish'],
   ['Birinchi mustaqil tarmoq','20.16-20.17 bilimini birlashtirib qo\'llash'],
   ['Natijani tekshirish','Bashoratni haqiqiy qiymat bilan solishtirish']
 ],
 detail:'BIRINCHI AMALIY VAZIFA — HAMMASINI BIRLASHTIRISH\n\nBu — 20.16 va 20.17 da o\'rgangan barcha qadamlarni (model qurish, compile qilish, o\'qitish) birlashtirib, MUSTAQIL ravishda oddiy bir neyron tarmoq yaratish vazifasi, so\'ngra predict() bilan yangi ma\'lumot uchun bashorat qilish.\n\nBU NEGA MUHIM? Bu — sizning birinchi to\'liq, ishlaydigan Deep Learning modelingiz! Keyingi barcha mavzular (CNN, RNN, Transformer) aynan shu asosiy workflow (Sequential → compile → fit → predict) ustiga quriladi, faqat qatlam turlari murakkablashadi.',
 sim:'>>> model = keras.Sequential([\n...     keras.layers.Dense(8, activation=\'relu\', input_shape=(2,)),\n...     keras.layers.Dense(1)\n... ])\n>>> model.compile(optimizer=\'adam\', loss=\'mse\')\n>>> model.fit(X, y, epochs=50)\n>>> model.predict([[5, 3]])\narray([[14.2]])',
 eskizlar:[
  {q:'2 xususiyatli kirish uchun to\'liq model qurib, compile qiling.',
   lines:[
    {c:'from tensorflow import keras',n:'Siz keras modulini import qildingiz'},

    {c:'model = keras.Sequential([',n:'Siz Sequential model yaratishni boshladingiz'},
    {c:'    keras.layers.Dense(8, activation=\'relu\', input_shape=(2,)),',n:'Siz 8 neyronli yashirin qatlam qo\'shdingiz (2 xususiyatli kirish uchun)'},
    {c:'    keras.layers.Dense(1)',n:'Siz 1 neyronli output qatlamni qo\'shdingiz'},
    {c:'])',n:'Siz model ro\'yxatini yopdingiz'},
    {c:'',n:'Bo\'sh qator'},
    {c:'model.compile(optimizer=\'adam\', loss=\'mse\')',n:'Siz modelni Adam va MSE bilan compile qildingiz'},
   ]},
  {q:'Modelni o\'qitib, yangi ma\'lumot uchun bashorat qiling.',
   lines:[
    {c:'model.fit(X, y, epochs=50)',n:'Siz modelni 50 epoch davomida o\'qitdingiz'},
    {c:'',n:'Bo\'sh qator'},
    {c:'yangi_nuqta = [[5, 3]]',n:'Siz yangi ma\'lumot nuqtasini yaratdingiz'},
    {c:'bashorat = model.predict(yangi_nuqta)',n:'Siz yangi nuqta uchun bashorat qildingiz'},
    {c:'print(\'Bashorat:\', bashorat)',n:'Siz bashoratni ekranga chiqardingiz'},
   ]},
 ]},

{id:'20.19', type:'test',
 title:'Oshiqcha moslashish va tartibga solish',
 terms:[
   ['Overfitting (Oshiqcha moslashish)','Tarmoq train ma\'lumotni yodlab, yangi ma\'lumotda yomon ishlashi'],
   ['Dropout','O\'qitish paytida tasodifiy neyronlarni "o\'chirib qo\'yish" usuli'],
   ['L1/L2 Regularization','Og\'irliklarni kichik ushlab turishga undovchi jazo qo\'shish'],
   ['Early Stopping','Validation xato yomonlashganda o\'qitishni to\'xtatish']
 ],
 detail:'NEYRON TARMOQLARDA OVERFITTING\n\n16-modulda Overfitting tushunchasini o\'rgangansiz — neyron tarmoqlar, ko\'p parametrga ega bo\'lgani uchun, BU MUAMMOGA AYNIQSA MOYIL. Tarmoq train ma\'lumotni "yodlab olishi", lekin yangi ma\'lumotda yomon ishlashi mumkin.\n\nDROPOUT: Eng mashhur va samarali yechimlardan biri. O\'qitish paytida, har bir qadamda, TASODIFIY tanlangan ba\'zi neyronlar "o\'chirib qo\'yiladi" (vaqtincha e\'tiborga olinmaydi). Bu tarmoqni biror bitta neyronga "haddan tashqari bog\'lanib qolishdan" saqlaydi, va u o\'rniga ko\'proq UMUMIY, barqaror naqshlarni o\'rganishga majburlaydi. Keras da: keras.layers.Dropout(0.3) — 30% neyronlar har qadamda tasodifiy o\'chiriladi.\n\nL1/L2 REGULARIZATION: 16-moduldagi Ridge/Lasso ga juda o\'xshash g\'oya — og\'irliklarning juda katta bo\'lishiga "jazo" qo\'shiladi, bu modelni soddaroq ushlab turadi.\n\nEARLY STOPPING: O\'qitish davomida, agar VALIDATION (sinov uchun ajratilgan, lekin trainga ishlatilmagan) ma\'lumotdagi xato YOMONLASHA boshlasa (train xato kamayishda davom etsa-da) — bu overfitting boshlangan degani, va o\'qitishni shu nuqtada TO\'XTATISH kerak, hatto belgilangan epoch soniga yetmagan bo\'lsa ham.',
 tests:[
   {q:'Dropout qanday ishlaydi?',
    opts:['Barcha neyronlarni butunlay o\'chiradi','O\'qitish paytida tasodifiy tanlangan neyronlarni vaqtincha "o\'chiradi"','Faqat test paytida ishlaydi','Ma\'lumotni o\'chiradi'],
    ans:1,
    exp:'Dropout — o\'qitish paytida har qadamda tasodifiy neyronlarni vaqtincha e\'tiborga olmaslik, bu modelni umumiyroq naqshlarni o\'rganishga undaydi.'},
   {q:'Early Stopping qachon o\'qitishni to\'xtatadi?',
    opts:['Belgilangan epoch soniga yetganda har doim','Validation xato yomonlasha boshlaganda (overfitting belgisi)','O\'qitish boshlanganidan keyin darhol','Hech qachon to\'xtamaydi'],
    ans:1,
    exp:'Early Stopping — validation ma\'lumotdagi xato yomonlasha boshlasa, bu overfitting belgisi, va o\'qitish shu nuqtada to\'xtatiladi.'},
   {q:'L1/L2 Regularization neyron tarmoqlarda qaysi klassik ML usuliga o\'xshash?',
    opts:['k-NN','Ridge/Lasso Regression','Decision Tree','K-Means'],
    ans:1,
    exp:'L1/L2 Regularization — 16-moduldagi Ridge (L2) va Lasso (L1) bilan bir xil g\'oyaga asoslangan: katta og\'irliklarga jazo qo\'shish.'}
 ]},

{id:'20.20', type:'test',
 title:'Giperparametrlar va parametrlar',
 terms:[
   ['Parametr','Model o\'qitish jarayonida o\'zi o\'rganadigan qiymatlar (og\'irlik, bias)'],
   ['Giperparametr','O\'qitishdan OLDIN inson tomonidan belgilanadigan sozlamalar'],
   ['Batch Size','Har bir og\'irlik yangilanishidan oldin ko\'rib chiqiladigan namunalar soni'],
   ['Grid/Random Search','Eng yaxshi giperparametr kombinatsiyasini qidirish usullari']
 ],
 detail:'PARAMETR VA GIPERPARAMETR FARQI\n\nBu ikkisi ko\'p chalkashtiriladi, lekin farq aniq:\n\nPARAMETR — model o\'qitish DAVOMIDA o\'zi o\'rganadigan qiymatlar: og\'irliklar (weights) va bias. Inson bularni qo\'lda belgilamaydi — Gradient Descent ularni avtomatik topadi.\n\nGIPERPARAMETR — o\'qitish BOSHLANISHIDAN OLDIN, inson tomonidan tanlanadigan sozlamalar: Learning Rate, Epoch soni, Batch Size, qatlamlar soni, har qatlamdagi neyron soni (units), Dropout darajasi va h.k. Bularni TO\'G\'RI tanlash — model sifatiga katta ta\'sir qiladi.\n\nBATCH SIZE NIMA? Amalda, butun train ma\'lumotini bir vaqtda tarmoqqa berish xotira jihatdan qiyin (ayniqsa katta datasetlarda). Shuning uchun ma\'lumot kichik "to\'plamlarga" (batch) bo\'linadi — masalan batch_size=32 — har 32 namunadan keyin og\'irliklar bir marta yangilanadi. Kichik batch — ko\'proq, lekin "shovqinli" yangilanishlar; katta batch — kamroq, lekin barqarorroq yangilanishlar.\n\nENG YAXSHI GIPERPARAMETRNI QANDAY TOPISH MUMKIN? Xuddi 17-moduldagi "eng yaxshi k" qidirish kabi — turli kombinatsiyalarni sinab ko\'rish (Grid Search — barcha kombinatsiyani sinash, Random Search — tasodifiy kombinatsiyalarni sinash) orqali eng yaxshi natija beradigan sozlamalar topiladi.',
 tests:[
   {q:'Quyidagilardan qaysi biri PARAMETR (model o\'zi o\'rganadigan), giperparametr emas?',
    opts:['Learning Rate','Epoch soni','Og\'irliklar (weights)','Batch Size'],
    ans:2,

    exp:'Grid Search — belgilangan barcha giperparametr kombinatsiyalarini ketma-ket sinab, eng yaxshi natija beradiganini topadi.'}

{id:'20.21', type:'test',
 title:'6-test',
 terms:[
   ['Qisqa nazorat','20.19-20.20 mavzularini birlashtiruvchi tekshiruv'],
   ['Overfitting yechimlari','Dropout, Regularization, Early Stopping'],
   ['Parametr vs Giperparametr','O\'zi o\'rganiladigan vs inson belgilaydigan sozlamalar'],
   ['1-qism yakuni','Asoslar bo\'limi tugadi, navbat CNN/RNN ga']
 ],
 detail:'QISQA NAZORAT — 20.19, 20.20 (1-QISM YAKUNI)\n\nBu nazorat Overfitting yechimlari (Dropout, Regularization, Early Stopping) va Parametr/Giperparametr farqini birlashtiradi — va shu bilan 20-modulning 1-qismi (Asoslar) yakunlanadi!\n\nKEYINGI QADAM: 2-qismda (20.22 dan boshlab) siz CNN (rasm uchun) va RNN (ketma-ketlik uchun) maxsus arxitekturalarini o\'rganasiz — ular aynan shu modulda o\'rgangan Dense qatlam, aktivlashtirish, loss/optimizer asoslari ustiga quriladi.',
 tests:[
   {q:'Quyidagilardan qaysi biri Overfitting ga qarshi YECHIM emas?',
    opts:['Dropout','Early Stopping','Learning Rate ni cheksiz oshirish','L2 Regularization'],
    ans:2,
    exp:'Learning Rate ni cheksiz oshirish Overfitting ga yechim emas — bu aslida o\'qitishni beqarorlashtirishi mumkin. Dropout, Early Stopping va Regularization — haqiqiy yechimlar.'},
   {q:'Giperparametrlar qachon belgilanadi?',
    opts:['O\'qitish davomida, avtomatik','O\'qitish boshlanishidan oldin, inson tomonidan','O\'qitish tugagandan keyin','Hech qachon belgilanmaydi'],
    ans:1,
    exp:'Giperparametrlar (Learning Rate, Epoch, Batch Size va h.k.) o\'qitish boshlanishidan OLDIN, inson tomonidan tanlanadi.'},
   {q:'20-modulning 2-qismida (20.22 dan boshlab) qaysi mavzular o\'rganiladi?',
    opts:['Faqat statistika','CNN va RNN maxsus arxitekturalari','Faqat SQL','Faqat web dizayn'],
    ans:1,
    exp:'2-qismda CNN (rasm uchun) va RNN (ketma-ketlik uchun) maxsus neyron tarmoq arxitekturalari o\'rganiladi.'}
 ]},

];

// ═══════ HOLAT ═══════
var cur=0, curEskiz=0, skipOn=false, ghostVisible=true;
var lineData=[], doneSet=new Set(), eskizDoneSet=new Set();
var testAnswers={}, selectedStar=0, ratingSubmitted=false;
var BRIGHT=[0,0.05,0.1,0.2,0.3,0.42,0.55,0.65,0.75,0.85,0.95];

window.onload=function(){buildStars();buildTabs();buildIntro();loadMod(0);};

function buildIntro(){
  var testTopics=M.filter(function(m){return m.type==='test';}).length;
  var eskizCount=M.reduce(function(s,m){return s+(m.type==='eskiz'?m.eskizlar.length:0);},0);
  var h='<div class="intro-title">'+MODULE_INTRO.title+'</div>';
  h+='<div class="intro-text">'+esc(MODULE_INTRO.text)+'</div>';
  h+='<div class="intro-stats">';
  h+='<div class="intro-stat"><div class="intro-stat-v">'+testTopics+'</div><div class="intro-stat-l">TEST</div></div>';
  h+='<div class="intro-stat"><div class="intro-stat-v">'+eskizCount+'</div><div class="intro-stat-l">ESKIZ</div></div>';
  h+='<div class="intro-stat"><div class="intro-stat-v">Keras</div><div class="intro-stat-l">KUTUBXONA</div></div>';
  h+='</div>';
  document.getElementById('introBox').innerHTML=h;
}

function loadMod(i){
  cur=i; curEskiz=0;
  document.getElementById('detailPanel').classList.remove('show');
  document.getElementById('badge') && (document.getElementById('badge').className='badge');
  var m=M[i];
  document.getElementById('topSub').textContent=m.id;
  document.getElementById('svMod').textContent=(i+1)+'/'+M.length;
  // terms
  var th='<div class="terms-title">📚 Yangi atamalar:</div>';
  m.terms.forEach(function(t){
    th+='<div class="term-row"><span class="term-key">'+esc(t[0])+'</span><span class="term-val">'+esc(t[1])+'</span></div>';
  });
  document.getElementById('termsBox').innerHTML=th;
  // content
  if(m.type==='test') renderTest(m);
  else renderEskiz(m);
  buildTabs(); updateTopStats();
}

// ═══════ TEST ═══════
function renderTest(m){
  if(!testAnswers[cur]) testAnswers[cur]={};
  var h='<div class="test-panel"><div class="test-title">🧠 '+m.title+' — Test</div>';
  m.tests.forEach(function(t,qi){
    h+='<div class="test-q" id="tq'+qi+'">';
    h+='<div class="test-qtext">'+(qi+1)+'. '+esc(t.q)+'</div>';
    h+='<div class="test-opts">';
    var answered = testAnswers[cur][qi] !== undefined;
    t.opts.forEach(function(o,oi){
      var cls='test-opt';
      if(answered){
        if(oi===t.ans) cls+=' show-correct';
        else if(oi===testAnswers[cur][qi] && oi!==t.ans) cls+=' wrong';
      }
      h+='<button class="'+cls+'" onclick="answerTest('+qi+','+oi+')" '+(answered?'disabled':'')+'>'+esc(o)+'</button>';
    });
    h+='</div>';
    if(answered){
      var isCorrect = testAnswers[cur][qi]===t.ans;
      h+='<div class="test-exp show">'+(isCorrect?'✅':'❌')+' '+esc(t.exp)+'</div>';
    }
    h+='</div>';
  });
  // score
  var answered=Object.keys(testAnswers[cur]).length;
  var correct=0;
  Object.keys(testAnswers[cur]).forEach(function(qi){
    if(testAnswers[cur][qi]===m.tests[qi].ans) correct++;
  });
  if(answered===m.tests.length){
    h+='<div class="test-score show">Natija: '+correct+'/'+m.tests.length+' ✅</div>';
    doneSet.add(cur);
  }
  h+='</div>';
  document.getElementById('mainContent').innerHTML=h;
  document.getElementById('result-panel') && document.getElementById('result-panel').classList.remove('show');
  updateTopStats();
}

function answerTest(qi,oi){
  if(!testAnswers[cur]) testAnswers[cur]={};
  if(testAnswers[cur][qi]!==undefined) return;
  testAnswers[cur][qi]=oi;
  renderTest(M[cur]);
  buildTabs(); updateTopStats();
}

// ═══════ ESKIZ (kod yozish mavzulari) ═══════
function renderEskiz(m){
  var e=m.eskizlar[curEskiz];
  // eskiz dots
  var dotsH='<div style="display:flex;gap:6px;justify-content:center;margin-bottom:10px;">';
  m.eskizlar.forEach(function(_,i){
    var key=cur+'-'+i;
    var w=i===curEskiz?'40px':'26px';
    var bg=eskizDoneSet.has(key)?'#22c55e':(i===curEskiz?'#00f0c8':'#1e3048');
    dotsH+='<div onclick="jumpEskiz('+i+')" style="width:'+w+';height:6px;border-radius:3px;background:'+bg+';cursor:pointer;transition:all .2s;"></div>';
  });
  dotsH+='</div>';
  // question
  var qH='<div style="background:#0d1828;border:1px solid #1e3048;border-left:3px solid #a855f7;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:.71rem;line-height:1.8;color:#c4b5fd;white-space:pre-wrap;">Eskiz '+(curEskiz+1)+'/'+m.eskizlar.length+' — '+esc(e.q)+'</div>';
  // skip row
  var skipH='<div class="skip-row" onclick="toggleSkip()"><div class="sw" id="sw"></div><span id="skipLbl"># Kommentlarni o\'tkazib yuboring</span></div>';
  // result panel
  var resH='<div class="result-panel" id="resultPanel"><div class="result-title">📊 NATIJA — SIMULYATSIYA</div><div class="sim-wrap" id="simWrap"></div></div>';
  // code block
  var codeH='<div class="code-block"><div class="fbar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><div class="fn" id="fname">dl_20a_'+(curEskiz+1)+'.py</div><div class="fhint">↔️ suring ✏️ yozing</div></div><div class="lines-wrap" id="linesWrap"></div><div class="btn-row"><button class="btn btn-chk" onclick="doCheck()">✅ Tekshir</button><button class="btn btn-clr" onclick="doClear()">🗑️ Tozala</button><button class="btn btn-ghost" id="ghostBtn" onclick="toggleGhost()">👁️ Yashir</button><button class="btn btn-det" onclick="toggleDetail()">📖 Batafsil</button><button class="btn btn-res" onclick="toggleResult()">📊 Natija</button></div><div class="badge" id="badge"></div></div>';
  document.getElementById('mainContent').innerHTML=dotsH+qH+skipH+resH+codeH;
  buildLines(e);
  // sync skip sw
  document.getElementById('sw').classList.toggle('on',skipOn);
  document.getElementById('skipLbl').textContent=skipOn?'Kommentlar o\'tkazilmoqda':'# Kommentlarni o\'tkazib yuboring';
  applyBright(); updateStats();
}

function jumpEskiz(i){ curEskiz=i; renderEskiz(M[cur]); }

function buildLines(e){
  var wrap=document.getElementById('linesWrap');
  if(!wrap) return;
  wrap.innerHTML=''; lineData=[];
  var op=BRIGHT[parseInt(document.getElementById('brightSlider').value)||3];
  e.lines.forEach(function(ln,i){
    var isCom=ln.c.replace(/^\s+/,'').charAt(0)==='#';
    var isEmpty=ln.c==='';
    var isSlash=ln.c.endsWith('\\');
    var block=document.createElement('div');
    block.className='line-block';
    var row=document.createElement('div');
    row.className='line-row';
    var num=document.createElement('div');
    num.className='line-num'; num.id='num'+i;
    num.textContent=isEmpty?'':(i+1);
    var content=document.createElement('div');
    content.className='line-content';
    var ghost=document.createElement('div');
    ghost.className='line-ghost'+((isCom&&skipOn)?' skip-c':'');
    ghost.id='ghost'+i;
    ghost.style.color=ghostVisible?'rgba(74,96,128,'+op+')':'transparent';
    ghost.textContent=ln.c||' ';
    var colors=document.createElement('div');
    colors.className='line-colors'; colors.id='clr'+i;
    var inp=document.createElement('input');
    inp.type='text'; inp.className='line-input'; inp.id='inp'+i;
    inp.setAttribute('spellcheck','false'); inp.setAttribute('autocorrect','off');
    inp.setAttribute('autocapitalize','off'); inp.setAttribute('autocomplete','off');
    if(isEmpty||(isCom&&skipOn)) inp.disabled=true;
    (function(idx,target,noteText){
      inp.addEventListener('input',function(){
        if(!target) return;
        updateLineClr(idx,target);
        if(inp.value===target&&target!==''&&noteText!=='') showNote(idx);
        else if(inp.value!==target) hideNote(idx);
        updateStats();
      });
    })(i,ln.c,ln.n);
    content.appendChild(ghost); content.appendChild(colors); content.appendChild(inp);
    row.appendChild(num); row.appendChild(content);
    var note=document.createElement('div');
    note.className='line-done-note'; note.id='note'+i;
    note.textContent=ln.n?('✅ '+ln.n+'!'):'';
    block.appendChild(row);
    if(ln.n) block.appendChild(note);
    wrap.appendChild(block);
    lineData.push({inp:inp,target:ln.c,isCom:isCom,isEmpty:isEmpty});
  });
}

function updateLineClr(idx,target){
  var inp=document.getElementById('inp'+idx);
  var clr=document.getElementById('clr'+idx);
  if(!inp||!clr) return;
  var typed=inp.value, html='';
  for(var ci=0;ci<target.length;ci++){
    var ch=target[ci];
    if(ci<typed.length) html+=typed[ci]===ch?'<span style="color:#22c55e">'+esc(ch)+'</span>':'<span style="color:#f43f5e;text-decoration:underline">'+esc(ch)+'</span>';
    else html+='<span style="color:transparent">'+esc(ch)+'</span>';
  }
  clr.innerHTML=html;
  var num=document.getElementById('num'+idx);
  if(num) num.style.color=(typed===target&&target!=='')?'#22c55e':'';
}

function showNote(i){var n=document.getElementById('note'+i);if(n&&n.textContent)n.classList.add('show');}
function hideNote(i){var n=document.getElementById('note'+i);if(n)n.classList.remove('show');}

function doCheck(){
  var e=M[cur].eskizlar[curEskiz];
  var done=0,total=0,errors=[];
  lineData.forEach(function(l,i){
    if(l.isEmpty||(l.isCom&&skipOn)) return;
    total++;
    if(l.inp.value===l.target){
      done++; document.getElementById('num'+i).style.color='#22c55e';
      if(e.lines[i].n) showNote(i);
    } else {
      errors.push(i+1); document.getElementById('num'+i).style.color='#f43f5e';
    }
  });
  var pct=total>0?Math.round(done/total*100):0;
  var b=document.getElementById('badge');
  if(!b) return;
  b.className='badge show';
  if(pct>=85){
    b.className+=' g';
    eskizDoneSet.add(cur+'-'+curEskiz);
    var isLast=curEskiz===M[cur].eskizlar.length-1;
    if(isLast){ doneSet.add(cur); b.textContent='✅ Zo\'r! '+pct+'% — barcha eskizlar tugadi!'; showRating(); }
    else { b.textContent='✅ Zo\'r! '+pct+'% — keyingi eskiz →'; setTimeout(function(){curEskiz++;renderEskiz(M[cur]);},900); }
  } else if(pct>=55){
    b.className+=' o'; b.textContent='⚡ '+pct+'% — xato qatorlar: '+errors.join(', ')+'-qator';
  } else {
    b.className+=' r'; b.textContent='❌ '+pct+'% — qaytadan urinib ko\'ring';
  }
  updateStats(); buildTabs();
}

function doClear(){
  lineData.forEach(function(l,i){
    l.inp.value='';
    var clr=document.getElementById('clr'+i); if(clr) clr.innerHTML='';
    var num=document.getElementById('num'+i); if(num) num.style.color='';
    hideNote(i);
  });
  var b=document.getElementById('badge'); if(b) b.className='badge';
  updateStats();
}

function updateStats(){
  if(M[cur].type!=='eskiz') return;
  var done=0,total=0;
  lineData.forEach(function(l){
    if(l.isEmpty||(l.isCom&&skipOn)) return;
    total++;
    if(l.inp.value===l.target) done++;
  });
  var pct=total>0?Math.round(done/total*100):0;
  document.getElementById('svDone').textContent=done+'/'+total;
  document.getElementById('svScore').textContent=done>0?pct+'%':'—';
  document.getElementById('progressFill').style.width=(doneSet.size/M.length*100)+'%';
}

function updateTopStats(){
  // test balini hisoblash
  var totalQ=0, correctQ=0;
  M.forEach(function(m,mi){
    if(m.type!=='test') return;
    m.tests.forEach(function(t,qi){
      totalQ++;
      if(testAnswers[mi]&&testAnswers[mi][qi]===t.ans) correctQ++;
    });
  });
  document.getElementById('svScore').textContent=totalQ>0?(correctQ+'/'+totalQ):'—';
  document.getElementById('svDone').textContent=doneSet.size+'/'+M.length;
  document.getElementById('progressFill').style.width=(doneSet.size/M.length*100)+'%';
}

function toggleGhost(){
  ghostVisible=!ghostVisible;
  document.querySelectorAll('.line-ghost').forEach(function(g){g.style.visibility=ghostVisible?'visible':'hidden';});
  var gb=document.getElementById('ghostBtn');
  if(gb) gb.textContent=ghostVisible?'👁️ Yashir':'👁️ Ko\'rsat';
}

function toggleSkip(){
  skipOn=!skipOn;
  var sw=document.getElementById('sw'); if(sw) sw.classList.toggle('on',skipOn);
  var sl=document.getElementById('skipLbl'); if(sl) sl.textContent=skipOn?'Kommentlar o\'tkazilmoqda':'# Kommentlarni o\'tkazib yuboring';
  if(M[cur].type==='eskiz'){ buildLines(M[cur].eskizlar[curEskiz]); applyBright(); updateStats(); }
}

function toggleDetail(){
  var p=document.getElementById('detailPanel');
  if(p.classList.contains('show')){p.classList.remove('show');}
  else{document.getElementById('detailContent').textContent=M[cur].detail;p.classList.add('show');}
}

function toggleResult(){
  var p=document.getElementById('resultPanel');
  if(!p) return;
  if(p.classList.contains('show')){p.classList.remove('show');}
  else{document.getElementById('simWrap').innerHTML='<pre>'+esc(M[cur].sim)+'</pre>';p.classList.add('show');}
}

function setBright(v){document.getElementById('brightVal').textContent=v;applyBright();}

function applyBright(){
  var v=parseInt(document.getElementById('brightSlider').value)||3;
  var op=BRIGHT[v];
  document.querySelectorAll('.line-ghost').forEach(function(g){
    if(!g.classList.contains('skip-c')&&ghostVisible) g.style.color='rgba(74,96,128,'+op+')';
  });
}

function buildTabs(){
  var c=document.getElementById('tabs'); c.innerHTML='';
  M.forEach(function(m,i){
    var d=document.createElement('div');
    d.className='tab'+(i===cur?' on':'')+(doneSet.has(i)?' done':'');
    d.textContent=m.id;
    d.onclick=(function(n){return function(){loadMod(n);};})(i);
    c.appendChild(d);
  });
}

function buildStars(){
  var sc=document.getElementById('stars'); sc.innerHTML='';
  for(var i=1;i<=10;i++){
    var s=document.createElement('span');
    s.className='star'; s.textContent='⭐'; s.dataset.v=i;
    s.onclick=(function(v){return function(){
      selectedStar=v;
      document.getElementById('ratingScore').textContent=v+' / 10';
      document.querySelectorAll('.star').forEach(function(st){st.classList.toggle('on',parseInt(st.dataset.v)<=v);});
    };})(i);
    sc.appendChild(s);
  }
}

function showRating(){document.getElementById('ratingBox').classList.add('show');}

function submitRating(){
  if(ratingSubmitted) return;
  if(selectedStar===0){alert('Baho tanlang!');return;}
  ratingSubmitted=true;
  document.getElementById('ratingThanks').style.display='block';
  document.querySelector('.rating-submit').style.display='none';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
