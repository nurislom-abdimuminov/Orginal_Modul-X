.intro-box{background:#0d1828;border:1px solid #1e3048;border-left:3px solid #00f0c8;border-radius:10px;padding:14px;margin-bottom:10px;}

.line-input{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;font-family:'JetBrains Mono',monospace;font-size:.76rem;line-height:1.8;padding:4px 8px;color:transparent;-webkit-text-fill-color:transparent;caret-color:#00f0c8;background:transparent;border:none;outline:none;white-space:pre;overflow:hidden;z-index:10;-webkit-appearance:none;}

.btn{padding:8px 11px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;border:none;cursor:pointer;flex-shrink:0;transition:opacity .15s;}
.btn:active{opacity:.7;}
.btn-chk{background:#00f0c8;color:#080c14;}
.btn-clr{background:transparent;border:1px solid #1e3048;color:#4a6080;}
.btn-det{background:#2563eb;color:#fff;}
.btn-ghost{background:#7c3aed;color:#fff;}
.btn-res{background:#16a34a;color:#fff;}
.badge{display:none;margin:0 12px 10px;padding:7px 12px;border-radius:8px;font-size:.7rem;border:1px solid #1e3048;}
.badge.show{display:block;}
.badge.g{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.07);}
.badge.o{border-color:#fbbf24;color:#fbbf24;background:rgba(251,191,36,.07);}
.badge.r{border-color:#f43f5e;color:#f43f5e;background:rgba(244,63,94,.07);}
.rating-box{background:#0d1828;border:1px solid #fbbf24;border-radius:12px;padding:14px 16px;margin-top:10px;display:none;}

.rating-comment{width:100%;background:#141e2e;border:1px solid #1e3048;border-radius:8px;padding:8px 10px;color:#dde5f0;font-family:'JetBrains Mono',monospace;font-size:.68rem;resize:none;outline:none;margin-bottom:8px;}

.rating-thanks{display:none;text-align:center;padding:10px;font-size:.72rem;color:#22c55e;font-weight:700;}

<script>
var MODULE_INTRO = {
  title: "📈 16-Modul haqida",
  text: "Bu modulda siz Regressiya — raqamli qiymatlarni bashorat qilish usullarini chuqur o'rganasiz.\n\nSimple Linear Regression dan boshlab, formula bilan qo'lda hisoblashni, keyin scikit-learn bilan tezroq ishlashni, so'ngra Multiple va Non-linear Regression turlarini, va nihoyat Underfitting/Overfitting muvozanatini o'rganasiz.\n\nBu modul — Machine Learning ning eng ko'p ishlatiladigan qismi: uy narxi, savdo bashorati, harorat, aksiya narxi — bularning barchasi regressiya orqali bashorat qilinadi.",
  count: 16
};

var M = [

{id:'16.1', type:'test',
 title:'Kirish — Regressiya nima?',
 terms:[
   ['Regressiya','Raqamli (uzluksiz) qiymatni bashorat qiluvchi ML usuli'],
   ['Bog\'liq o\'zgaruvchi (Y)','Bashorat qilinayotgan natija'],
   ['Bog\'liqsiz o\'zgaruvchi (X)','Bashorat uchun ishlatiladigan kirish ma\'lumoti'],
   ['Korrelyatsiya','X va Y orasidagi chiziqli bog\'liqlik kuchi (-1 dan +1 gacha)']
 ],
 detail:'REGRESSIYA NIMA?\n\nRegressiya — Supervised Learning ning bir turi, lekin Classification dan farqli o\'laroq, u toifa emas, RAQAMLI qiymat bashorat qiladi. Masalan: "bu email spam yoki yo\'q" — Classification. "Bu uy qancha turadi" — Regressiya.\n\nX VA Y NIMA?\nX (feature, xususiyat) — modelga beriladigan kirish ma\'lumot. Y (label, natija) — model bashorat qilishi kerak bo\'lgan qiymat. Masalan uy narxini bashorat qilishda: X = xonalar soni, maydon, joylashuv; Y = narx.\n\nKORRELYATSIYA NEGA MUHIM?\nRegressiya modelini qurishdan oldin, X va Y orasida bog\'liqlik bor-yo\'qligini tekshirish kerak. Korrelyatsiya koeffitsienti +1 ga yaqin bo\'lsa — kuchli musbat bog\'liqlik (X oshganda Y ham oshadi). -1 ga yaqin — kuchli manfiy bog\'liqlik. 0 ga yaqin — bog\'liqlik kuchsiz, regressiya yaxshi natija bermasligi mumkin.\n\nREAL HAYOTDA REGRESSIYA:\nUy-joy narxini bashorat qilish, ob-havo haroratini bashorat qilish, kompaniya savdosini bashorat qilish, talaba bahosini bashorat qilish, aksiya narxini tahlil qilish — bularning barchasi regressiya masalalari.',
 tests:[
   {q:'Regressiya nima narsani bashorat qiladi?',
    opts:['Toifa (masalan spam/spam emas)','Raqamli (uzluksiz) qiymat','Rasm ichidagi obyektni','Matn tilini'],
    ans:1,
    exp:'Regressiya raqamli (uzluksiz) qiymatlarni bashorat qiladi — masalan narx, harorat, ball. Toifalarni Classification bashorat qiladi.'},
   {q:'X va Y orasida kuchli musbat korrelyatsiya bo\'lsa, bu nimani bildiradi?',
    opts:['X va Y bog\'liq emas','X oshganda Y kamayadi','X oshganda Y ham oshish tendensiyasida','Y har doim X dan katta'],
    ans:2,
    exp:'Musbat korrelyatsiya — X oshganda Y ham oshadi degan tendensiyani bildiradi. Bu regressiya uchun yaxshi belgi.'},
   {q:'Quyidagilardan qaysi biri Regressiya masalasiga misol?',
    opts:['Email spam yoki spam emasligini aniqlash','Rasmda it yoki mushuk borligini aniqlash','Uy narxini bashorat qilish','Mijozlarni guruhlarga ajratish'],
    ans:2,
    exp:'Uy narxi — raqamli qiymat, shuning uchun bu Regressiya masalasi. Qolganlari Classification yoki Clustering ga misol.'}
 ]},

{id:'16.2', type:'test',
 title:'Simple Linear Regression',
 terms:[
   ['Simple Linear Regression','Bitta X asosida Y ni bashorat qiluvchi chiziqli model'],
   ['y = mx + b','Chiziqli regressiya formulasi'],
   ['Least Squares','Eng kichik kvadratlar usuli — optimal chiziqni topish usuli'],
   ['Residual','Haqiqiy va bashorat qilingan Y orasidagi farq']
 ],
 detail:'SIMPLE LINEAR REGRESSION FORMULASI\n\ny = mx + b\n\nBu yerda: m — slope (og\'ish koeffitsienti, chiziq qanchalik tik), b — intercept (X=0 bo\'lganda Y qiymati), x — kirish qiymati, y — bashorat qilingan natija.\n\nENG YAXSHI CHIZIQ QANDAY TOPILADI?\nMa\'lumotlar nuqtalar bulutini hosil qiladi. Maqsad — shu nuqtalarga "eng yaqin" to\'g\'ri chiziqni topish. "Eng yaqin" qanday o\'lchanadi? LEAST SQUARES usuli orqali: har bir nuqta uchun residual (haqiqiy Y - bashorat Y) hisoblanadi, bu residuallar kvadratga ko\'tariladi va yig\'iladi. Eng kichik yig\'indini beradigan m va b qiymatlari — "eng yaxshi chiziq".\n\nNEGA KVADRATGA KO\'TARILADI?\nIkki sabab bor: birinchi, manfiy va musbat residuallar bir-birini "yo\'qotib qo\'ymasin" uchun (kvadrat har doim musbat). Ikkinchi, katta xatolarni kichik xatolarga qaraganda kuchliroq jazolash uchun — bu modelni katta xatolardan qochishga undaydi.\n\nRESIDUAL NIMA?\nResidual = haqiqiy qiymat - bashorat qilingan qiymat. Agar uy haqiqatda 100 million, model 95 million deb bashorat qilsa, residual = 5 million. Yaxshi model — residuallari kichik bo\'lgan model.',
 tests:[
   {q:'Simple Linear Regression formulasi y = mx + b da "m" nimani bildiradi?',
    opts:['X ning o\'zi','Slope (og\'ish koeffitsienti)','Intercept','Residual'],
    ans:1,
    exp:'"m" — slope, chiziqning og\'ish darajasini bildiradi. Katta m — tikroq chiziq.'},
   {q:'Least Squares usuli nimani minimallashtiradi?',
    opts:['X qiymatlarini','Residuallar kvadratlari yig\'indisini','Model tezligini','Ma\'lumot sonini'],
    ans:1,
    exp:'Least Squares — barcha nuqtalar uchun residuallar (xatolar) kvadratga ko\'tarilgan yig\'indisini eng kichik qiladigan chiziqni topadi.'},
   {q:'"b" (intercept) qaysi holatdagi Y qiymatini bildiradi?',
    opts:['X eng katta bo\'lganda','X=0 bo\'lganda','Y eng kichik bo\'lganda','X manfiy bo\'lganda'],
    ans:1,
    exp:'Intercept (b) — X=0 bo\'lganda chiziq Y o\'qini kesib o\'tadigan nuqta, ya\'ni boshlang\'ich qiymat.'}
 ]},

{id:'16.3', type:'eskiz',
 title:'Simple Linear Regression. Vazifa',
 terms:[
   ['Variance (Dispersiya)','Qiymatlarning o\'rtachadan necha og\'ishini ko\'rsatadi'],
   ['Covariance (Kovariatsiya)','Ikki o\'zgaruvchi birgalikda qanday o\'zgarishini ko\'rsatadi'],
   ['np.mean()','NumPy da o\'rtacha qiymatni hisoblash funksiyasi'],
   ['np.polyfit()','NumPy da chiziqli koeffitsientlarni avtomatik topish funksiyasi']
 ],
 detail:'QO\'LDA HISOBLASH FORMULASI\n\nslope (m) = sum((x - x_o\'rtacha) * (y - y_o\'rtacha)) / sum((x - x_o\'rtacha)^2)\nintercept (b) = y_o\'rtacha - m * x_o\'rtacha\n\nBu formula aslida COVARIANCE / VARIANCE nisbatidan iborat — x va y birgalikda qanchalik o\'zgarishini (covariance) x ning o\'z ichidagi o\'zgarishiga (variance) bo\'lish.\n\nNUMPY BILAN TEZ YO\'L: np.polyfit(x, y, 1) — bu funksiya darajasi 1 (chiziqli) bo\'lgan eng mos koeffitsientlarni avtomatik qaytaradi: natija [slope, intercept] ko\'rinishida keladi. Bu qo\'lda formula yozishning qisqartirilgan yo\'li, ammo formulani tushunish muhim — chunki bu barcha regressiya algoritmlarining negizi.',
 sim:'>>> import numpy as np\n>>> x = np.array([1, 2, 3, 4, 5])\n>>> y = np.array([2, 4, 5, 4, 5])\n>>> x_o = np.mean(x)\n>>> y_o = np.mean(y)\n>>> slope = np.sum((x-x_o)*(y-y_o)) / np.sum((x-x_o)**2)\n>>> intercept = y_o - slope*x_o\n>>> print(slope, intercept)\n0.6 2.2\n\n>>> # tezroq yo\'l:\n>>> np.polyfit(x, y, 1)\narray([0.6, 2.2])',
 eskizlar:[
  {q:'numpy bilan x, y massivlarini yaratib, o\'rtachalarini hisoblang.',
   lines:[
    {c:'import numpy as np',n:'Siz numpy kutubxonasini np nomi bilan yukladingiz'},
    {c:'',n:'Bo\'sh qator'},
    {c:'x = np.array([1, 2, 3, 4, 5])',n:'Siz x massivini yaratdingiz'},
    {c:'y = np.array([2, 4, 5, 4, 5])',n:'Siz y massivini yaratdingiz'},
    {c:'',n:'Bo\'sh qator'},
    {c:'x_o = np.mean(x)',n:'Siz x ning o\'rtacha qiymatini hisobladingiz'},
    {c:'y_o = np.mean(y)',n:'Siz y ning o\'rtacha qiymatini hisobladingiz'},
    {c:'print(x_o, y_o)',n:'Siz o\'rtacha qiymatlarni ekranga chiqardingiz'},

 detail:'NEGA QO\'LDA FORMULA EMAS, SKLEARN?\n\nQo\'lda formula yozish — tushunish uchun zarur, lekin amalda sklearn ishlatiladi: kamroq kod, xatoga kamroq joy, va eng muhimi — bir xil .fit()/.predict() API barcha modellar uchun ishlaydi (LinearRegression, LogisticRegression, RandomForest — hammasi shu metodlarga ega).\n\nASOSIY QADAMLAR:\n1. from sklearn.linear_model import LinearRegression\n2. model = LinearRegression()\n3. model.fit(X, y) — o\'qitish\n4. model.predict(X_yangi) — bashorat\n\nMUHIM TUZOQ: X 2D FORMATDA BO\'LISHI KERAK!\nsklearn har doim X ni 2D massiv (qator x ustun) deb kutadi — chunki u ko\'p xususiyatli holatlar uchun mo\'ljallangan. Agar X bitta xususiyatli oddiy ro\'yxat bo\'lsa (masalan [1,2,3,4,5]), uni reshape(-1, 1) bilan 2D ustunga aylantirish kerak, aks holda xato chiqadi. Bu eng ko\'p uchraydigan boshlang\'ich xato.\n\n.COEF_ VA .INTERCEPT_: model.fit() dan keyin, model.coef_ — o\'qitilgan slope(lar)ni, model.intercept_ — intercept qiymatini qaytaradi. Bular qo\'lda hisoblangan m va b bilan bir xil mantiqqa ega.',
 tests:[
   {q:'sklearn da modelni ma\'lumotga o\'qitish uchun qaysi metod ishlatiladi?',
    opts:['.train()','.fit()','.learn()','.run()'],
    ans:1,
    exp:'.fit(X, y) — sklearn dagi barcha modellarni o\'qitish uchun standart metod.'},
   {q:'Simple LR da X massivi nima uchun 2D (masalan reshape(-1,1)) bo\'lishi kerak?',
    opts:['Tezroq ishlashi uchun','sklearn har doim 2D (qator x ustun) formatni kutadi','Xotira tejash uchun','Bu majburiy emas'],
    ans:1,
    exp:'sklearn barcha modellari X ni 2D format deb kutadi, chunki API ko\'p xususiyatli holatlar uchun universal qilingan.'},
   {q:'model.fit(X, y) dan keyin model.coef_ nimani qaytaradi?',
    opts:['Ma\'lumotlar sonini','O\'qitilgan slope (koeffitsient) qiymatini','X massivining o\'zini','Xato xabarini'],
    ans:1,
    exp:'.coef_ — model o\'qitilganidan keyin topilgan slope qiymati(lari)ni qaytaradi.'}
 ]},

{id:'16.9', type:'test',
 title:'Multiple Linear Regression',
 terms:[
   ['Multiple Linear Regression','Bir nechta X asosida Y ni bashorat qiluvchi model'],
   ['y = w1x1 + w2x2 + ... + b','Ko\'p o\'zgaruvchili chiziqli formula'],
   ['Feature (xususiyat)','Modelga kirish sifatida beriladigan har bir ustun'],
   ['Koeffitsientlar vektori','Har bir xususiyat uchun alohida og\'irlik qiymati']
 ],
 detail:'SIMPLE DAN MULTIPLE GA\n\nKo\'pchilik real masalalarda natija faqat bitta omilga bog\'liq emas. Uy narxi nafaqat maydonga, balki xonalar soniga, qurilgan yiliga, joylashuviga ham bog\'liq. Multiple Linear Regression aynan shu — bir nechta X (xususiyat) asosida Y ni bashorat qiladi:\n\ny = w1*x1 + w2*x2 + w3*x3 + ... + b\n\nHar bir xususiyat (x1, x2, x3...) o\'zining alohida og\'irligiga (w1, w2, w3...) ega. Model o\'qitilganda, har bir xususiyat uchun mos og\'irlikni topadi.\n\nKOEFFITSIENTLARNI TALQIN QILISH QIYINLASHADI: Simple LR da bitta coef_ bor edi. Multiple LR da coef_ — massiv (har bir xususiyat uchun bitta son). Bularni talqin qilishda "boshqa xususiyatlar o\'zgarmas qolganda" degan shart bilan o\'qish kerak — masalan "xonalar soni bir birlik oshganda, narx w1 ga oshadi, AGAR maydon va joylashuv o\'zgarmasa".\n\nMUHIM ESLATMA: Xususiyatlar soni ko\'paysa, model murakkablashadi va overfitting xavfi oshadi (16.16 da batafsil ko\'riladi).',
 tests:[
   {q:'Multiple Linear Regression Simple LR dan nimasi bilan farq qiladi?',
    opts:['Boshqa dasturlash tilida yoziladi','Bir nechta X (xususiyat) ishlatadi','Faqat rasm bilan ishlaydi','Y raqamli emas, toifaviy bo\'ladi'],
    ans:1,
    exp:'Multiple LR bir nechta xususiyat (X1, X2, X3...) asosida bitta Y ni bashorat qiladi, Simple LR esa faqat bitta X ishlatadi.'},
   {q:'Multiple LR da model.coef_ nimani qaytaradi?',
    opts:['Bitta son','Har bir xususiyat uchun alohida koeffitsientlar massivi','Faqat intercept qiymatini','Ma\'lumotlar sonini'],
    ans:1,
    exp:'Multiple LR da coef_ — har bir xususiyat (feature) uchun alohida og\'irlik qiymatlaridan iborat massiv bo\'ladi.'},
   {q:'Uy narxini xonalar soni, maydon va joylashuv asosida bashorat qilish — bu qaysi model?',
    opts:['Simple Linear Regression','Multiple Linear Regression','Classification','Clustering'],
    ans:1,
    exp:'Bir nechta xususiyat (xonalar soni, maydon, joylashuv) ishlatilgani uchun bu Multiple Linear Regression.'}
 ]},

 ],
 detail:'IKKI XATO TURI\n\nUNDERFITTING: Model juda sodda — hatto train ma\'lumotdagi asosiy naqshni ham topa olmaydi. Misol: egri (curve) shakldagi ma\'lumotga degree=1 (oddiy chiziq) qo\'llash. Natija: train da ham, test da ham past aniqlik.\n\nOVERFITTING: Model juda murakkab — train ma\'lumotni "yodlab" oladi, hatto tasodifiy shovqinni ham. Misol: degree=15 polinomial regressiya kichik datasetga. Natija: train da deyarli 100% aniqlik, lekin test da juda past — model yangi ma\'lumotda umuman ishlamaydi.\n\nBIAS-VARIANCE TRADEOFF: Bias — model qanchalik sodda taxminlar qiladi (yuqori bias = underfitting). Variance — model ma\'lumot o\'zgarishiga qanchalik sezgir (yuqori variance = overfitting). Yaxshi model — bu ikkisi orasidagi muvozanat nuqtasi.\n\nQANDAY ANIQLASH MUMKIN? Train va test natijalarini solishtirish: ikkisi ham past — underfitting. Train juda yuqori, test past — overfitting. Ikkisi yaqin va yetarlicha yuqori — yaxshi muvozanat.\n\nYECHIMLAR: Underfitting uchun — murakkabroq model yoki ko\'proq xususiyat. Overfitting uchun — Regularization (Ridge/Lasso), kamroq daraja, ko\'proq ma\'lumot, yoki Cross-Validation bilan eng mos murakkablikni tanlash.',

// ═══════ HOLAT ═══════
var cur=0, curEskiz=0, skipOn=false, ghostVisible=true;
var lineData=[], doneSet=new Set(), eskizDoneSet=new Set();
var testAnswers={}, selectedStar=0, ratingSubmitted=false;
var BRIGHT=[0,0.05,0.1,0.2,0.3,0.42,0.55,0.65,0.75,0.85,0.95];

window.onload=function(){buildStars();buildTabs();buildIntro();loadMod(0);};

function buildIntro(){
  var testTopics=M.filter(function(m){return m.type==='test';}).length;
  var eskizCount=M.reduce(function(s,m){return s+(m.type==='eskiz'?m.eskizlar.length:0);},0);
  var h='<div class="intro-title">'+MODULE_INTRO.title+'</div>';
  h+='<div class="intro-text">'+esc(MODULE_INTRO.text)+'</div>';
  h+='<div class="intro-stats">';
  h+='<div class="intro-stat"><div class="intro-stat-v">'+testTopics+'</div><div class="intro-stat-l">TEST</div></div>';
  h+='<div class="intro-stat"><div class="intro-stat-v">'+eskizCount+'</div><div class="intro-stat-l">ESKIZ</div></div>';
  h+='<div class="intro-stat"><div class="intro-stat-v">sklearn</div><div class="intro-stat-l">KUTUBXONA</div></div>';
  h+='</div>';
  document.getElementById('introBox').innerHTML=h;
}

function loadMod(i){
  cur=i; curEskiz=0;
  document.getElementById('detailPanel').classList.remove('show');
  document.getElementById('badge') && (document.getElementById('badge').className='badge');
  var m=M[i];
  document.getElementById('topSub').textContent=m.id;
  document.getElementById('svMod').textContent=(i+1)+'/'+M.length;
  // terms
  var th='<div class="terms-title">📚 Yangi atamalar:</div>';
  m.terms.forEach(function(t){
    th+='<div class="term-row"><span class="term-key">'+esc(t[0])+'</span><span class="term-val">'+esc(t[1])+'</span></div>';
  });
  document.getElementById('termsBox').innerHTML=th;
  // content
  if(m.type==='test') renderTest(m);
  else renderEskiz(m);
  buildTabs(); updateTopStats();
}

// ═══════ TEST ═══════
function renderTest(m){
  if(!testAnswers[cur]) testAnswers[cur]={};
  var h='<div class="test-panel"><div class="test-title">🧠 '+m.title+' — Test</div>';
  m.tests.forEach(function(t,qi){
    h+='<div class="test-q" id="tq'+qi+'">';
    h+='<div class="test-qtext">'+(qi+1)+'. '+esc(t.q)+'</div>';
    h+='<div class="test-opts">';
    var answered = testAnswers[cur][qi] !== undefined;
    t.opts.forEach(function(o,oi){
      var cls='test-opt';
      if(answered){
        if(oi===t.ans) cls+=' show-correct';
        else if(oi===testAnswers[cur][qi] && oi!==t.ans) cls+=' wrong';
      }
      h+='<button class="'+cls+'" onclick="answerTest('+qi+','+oi+')" '+(answered?'disabled':'')+'>'+esc(o)+'</button>';
    });
    h+='</div>';
    if(answered){
      var isCorrect = testAnswers[cur][qi]===t.ans;
      h+='<div class="test-exp show">'+(isCorrect?'✅':'❌')+' '+esc(t.exp)+'</div>';
    }
    h+='</div>';
  });
  // score
  var answered=Object.keys(testAnswers[cur]).length;
  var correct=0;
  Object.keys(testAnswers[cur]).forEach(function(qi){
    if(testAnswers[cur][qi]===m.tests[qi].ans) correct++;
  });
  if(answered===m.tests.length){
    h+='<div class="test-score show">Natija: '+correct+'/'+m.tests.length+' ✅</div>';
    doneSet.add(cur);
  }
  h+='</div>';
  document.getElementById('mainContent').innerHTML=h;
  document.getElementById('result-panel') && document.getElementById('result-panel').classList.remove('show');
  updateTopStats();
}

function answerTest(qi,oi){
  if(!testAnswers[cur]) testAnswers[cur]={};
  if(testAnswers[cur][qi]!==undefined) return;
  testAnswers[cur][qi]=oi;
  renderTest(M[cur]);
  buildTabs(); updateTopStats();
}

// ═══════ ESKIZ (kod yozish mavzulari) ═══════
function renderEskiz(m){
  var e=m.eskizlar[curEskiz];
  // eskiz dots
  var dotsH='<div style="display:flex;gap:6px;justify-content:center;margin-bottom:10px;">';
  m.eskizlar.forEach(function(_,i){
    var key=cur+'-'+i;
    var w=i===curEskiz?'40px':'26px';
    var bg=eskizDoneSet.has(key)?'#22c55e':(i===curEskiz?'#00f0c8':'#1e3048');
    dotsH+='<div onclick="jumpEskiz('+i+')" style="width:'+w+';height:6px;border-radius:3px;background:'+bg+';cursor:pointer;transition:all .2s;"></div>';
  });
  dotsH+='</div>';
  // question
  var qH='<div style="background:#0d1828;border:1px solid #1e3048;border-left:3px solid #a855f7;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:.71rem;line-height:1.8;color:#c4b5fd;white-space:pre-wrap;">Eskiz '+(curEskiz+1)+'/'+m.eskizlar.length+' — '+esc(e.q)+'</div>';
  // skip row
  var skipH='<div class="skip-row" onclick="toggleSkip()"><div class="sw" id="sw"></div><span id="skipLbl"># Kommentlarni o\'tkazib yuboring</span></div>';
  // result panel
  var resH='<div class="result-panel" id="resultPanel"><div class="result-title">📊 NATIJA — SIMULYATSIYA</div><div class="sim-wrap" id="simWrap"></div></div>';
  // code block
  var codeH='<div class="code-block"><div class="fbar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><div class="fn" id="fname">reg_16_'+(curEskiz+1)+'.py</div><div class="fhint">↔️ suring ✏️ yozing</div></div><div class="lines-wrap" id="linesWrap"></div><div class="btn-row"><button class="btn btn-chk" onclick="doCheck()">✅ Tekshir</button><button class="btn btn-clr" onclick="doClear()">🗑️ Tozala</button><button class="btn btn-ghost" id="ghostBtn" onclick="toggleGhost()">👁️ Yashir</button><button class="btn btn-det" onclick="toggleDetail()">📖 Batafsil</button><button class="btn btn-res" onclick="toggleResult()">📊 Natija</button></div><div class="badge" id="badge"></div></div>';
  document.getElementById('mainContent').innerHTML=dotsH+qH+skipH+resH+codeH;
  buildLines(e);
  // sync skip sw
  document.getElementById('sw').classList.toggle('on',skipOn);
  document.getElementById('skipLbl').textContent=skipOn?'Kommentlar o\'tkazilmoqda':'# Kommentlarni o\'tkazib yuboring';
  applyBright(); updateStats();
}

function jumpEskiz(i){ curEskiz=i; renderEskiz(M[cur]); }

function buildLines(e){
  var wrap=document.getElementById('linesWrap');
  if(!wrap) return;
  wrap.innerHTML=''; lineData=[];
  var op=BRIGHT[parseInt(document.getElementById('brightSlider').value)||3];
  e.lines.forEach(function(ln,i){
    var isCom=ln.c.replace(/^\s+/,'').charAt(0)==='#';
    var isEmpty=ln.c==='';
    var isSlash=ln.c.endsWith('\\');
    var block=document.createElement('div');
    block.className='line-block';
    var row=document.createElement('div');
    row.className='line-row';
    var num=document.createElement('div');
    num.className='line-num'; num.id='num'+i;
    num.textContent=isEmpty?'':(i+1);
    var content=document.createElement('div');
    content.className='line-content';
    var ghost=document.createElement('div');
    ghost.className='line-ghost'+((isCom&&skipOn)?' skip-c':'');
    ghost.id='ghost'+i;
    ghost.style.color=ghostVisible?'rgba(74,96,128,'+op+')':'transparent';
    ghost.textContent=ln.c||' ';
    var colors=document.createElement('div');
    colors.className='line-colors'; colors.id='clr'+i;
    var inp=document.createElement('input');
    inp.type='text'; inp.className='line-input'; inp.id='inp'+i;
    inp.setAttribute('spellcheck','false'); inp.setAttribute('autocorrect','off');
    inp.setAttribute('autocapitalize','off'); inp.setAttribute('autocomplete','off');
    if(isEmpty||(isCom&&skipOn)) inp.disabled=true;
    (function(idx,target,noteText){
      inp.addEventListener('input',function(){
        if(!target) return;
        updateLineClr(idx,target);
        if(inp.value===target&&target!==''&&noteText!=='') showNote(idx);
        else if(inp.value!==target) hideNote(idx);
        updateStats();
      });
    })(i,ln.c,ln.n);
    content.appendChild(ghost); content.appendChild(colors); content.appendChild(inp);
    row.appendChild(num); row.appendChild(content);
    var note=document.createElement('div');
    note.className='line-done-note'; note.id='note'+i;
    note.textContent=ln.n?('✅ '+ln.n+'!'):'';
    block.appendChild(row);
    if(ln.n) block.appendChild(note);
    wrap.appendChild(block);
    lineData.push({inp:inp,target:ln.c,isCom:isCom,isEmpty:isEmpty});
  });
}

function updateLineClr(idx,target){
  var inp=document.getElementById('inp'+idx);
  var clr=document.getElementById('clr'+idx);
  if(!inp||!clr) return;
  var typed=inp.value, html='';
  for(var ci=0;ci<target.length;ci++){
    var ch=target[ci];
    if(ci<typed.length) html+=typed[ci]===ch?'<span style="color:#22c55e">'+esc(ch)+'</span>':'<span style="color:#f43f5e;text-decoration:underline">'+esc(ch)+'</span>';
    else html+='<span style="color:transparent">'+esc(ch)+'</span>';
  }
  clr.innerHTML=html;
  var num=document.getElementById('num'+idx);
  if(num) num.style.color=(typed===target&&target!=='')?'#22c55e':'';
}

function showNote(i){var n=document.getElementById('note'+i);if(n&&n.textContent)n.classList.add('show');}
function hideNote(i){var n=document.getElementById('note'+i);if(n)n.classList.remove('show');}

function doCheck(){
  var e=M[cur].eskizlar[curEskiz];
  var done=0,total=0,errors=[];
  lineData.forEach(function(l,i){
    if(l.isEmpty||(l.isCom&&skipOn)) return;
    total++;
    if(l.inp.value===l.target){
      done++; document.getElementById('num'+i).style.color='#22c55e';
      if(e.lines[i].n) showNote(i);
    } else {
      errors.push(i+1); document.getElementById('num'+i).style.color='#f43f5e';
    }
  });
  var pct=total>0?Math.round(done/total*100):0;
  var b=document.getElementById('badge');
  if(!b) return;
  b.className='badge show';
  if(pct>=85){
    b.className+=' g';
    eskizDoneSet.add(cur+'-'+curEskiz);
    var isLast=curEskiz===M[cur].eskizlar.length-1;
    if(isLast){ doneSet.add(cur); b.textContent='✅ Zo\'r! '+pct+'% — barcha eskizlar tugadi!'; showRating(); }
    else { b.textContent='✅ Zo\'r! '+pct+'% — keyingi eskiz →'; setTimeout(function(){curEskiz++;renderEskiz(M[cur]);},900); }
  } else if(pct>=55){
    b.className+=' o'; b.textContent='⚡ '+pct+'% — xato qatorlar: '+errors.join(', ')+'-qator';
  } else {
    b.className+=' r'; b.textContent='❌ '+pct+'% — qaytadan urinib ko\'ring';
  }
  updateStats(); buildTabs();
}

function doClear(){
  lineData.forEach(function(l,i){
    l.inp.value='';
    var clr=document.getElementById('clr'+i); if(clr) clr.innerHTML='';
    var num=document.getElementById('num'+i); if(num) num.style.color='';
    hideNote(i);
  });
  var b=document.getElementById('badge'); if(b) b.className='badge';
  updateStats();
}

function updateStats(){
  if(M[cur].type!=='eskiz') return;
  var done=0,total=0;
  lineData.forEach(function(l){
    if(l.isEmpty||(l.isCom&&skipOn)) return;
    total++;
    if(l.inp.value===l.target) done++;
  });
  var pct=total>0?Math.round(done/total*100):0;
  document.getElementById('svDone').textContent=done+'/'+total;
  document.getElementById('svScore').textContent=done>0?pct+'%':'—';
  document.getElementById('progressFill').style.width=(doneSet.size/M.length*100)+'%';
}

function updateTopStats(){
  // test balini hisoblash
  var totalQ=0, correctQ=0;
  M.forEach(function(m,mi){
    if(m.type!=='test') return;
    m.tests.forEach(function(t,qi){
      totalQ++;
      if(testAnswers[mi]&&testAnswers[mi][qi]===t.ans) correctQ++;
    });
  });
  document.getElementById('svScore').textContent=totalQ>0?(correctQ+'/'+totalQ):'—';
  document.getElementById('svDone').textContent=doneSet.size+'/'+M.length;
  document.getElementById('progressFill').style.width=(doneSet.size/M.length*100)+'%';
}

function toggleGhost(){
  ghostVisible=!ghostVisible;
  document.querySelectorAll('.line-ghost').forEach(function(g){g.style.visibility=ghostVisible?'visible':'hidden';});
  var gb=document.getElementById('ghostBtn');
  if(gb) gb.textContent=ghostVisible?'👁️ Yashir':'👁️ Ko\'rsat';
}

function toggleSkip(){
  skipOn=!skipOn;
  var sw=document.getElementById('sw'); if(sw) sw.classList.toggle('on',skipOn);
  var sl=document.getElementById('skipLbl'); if(sl) sl.textContent=skipOn?'Kommentlar o\'tkazilmoqda':'# Kommentlarni o\'tkazib yuboring';
  if(M[cur].type==='eskiz'){ buildLines(M[cur].eskizlar[curEskiz]); applyBright(); updateStats(); }
}

function toggleDetail(){
  var p=document.getElementById('detailPanel');
  if(p.classList.contains('show')){p.classList.remove('show');}
  else{document.getElementById('detailContent').textContent=M[cur].detail;p.classList.add('show');}
}

function toggleResult(){
  var p=document.getElementById('resultPanel');
  if(!p) return;
  if(p.classList.contains('show')){p.classList.remove('show');}
  else{document.getElementById('simWrap').innerHTML='<pre>'+esc(M[cur].sim)+'</pre>';p.classList.add('show');}
}

function setBright(v){document.getElementById('brightVal').textContent=v;applyBright();}

function applyBright(){
  var v=parseInt(document.getElementById('brightSlider').value)||3;
  var op=BRIGHT[v];
  document.querySelectorAll('.line-ghost').forEach(function(g){
    if(!g.classList.contains('skip-c')&&ghostVisible) g.style.color='rgba(74,96,128,'+op+')';
  });
}

function buildTabs(){
  var c=document.getElementById('tabs'); c.innerHTML='';
  M.forEach(function(m,i){
    var d=document.createElement('div');
    d.className='tab'+(i===cur?' on':'')+(doneSet.has(i)?' done':'');
    d.textContent=m.id;
    d.onclick=(function(n){return function(){loadMod(n);};})(i);
    c.appendChild(d);
  });
}

function buildStars(){
  var sc=document.getElementById('stars'); sc.innerHTML='';
  for(var i=1;i<=10;i++){
    var s=document.createElement('span');
    s.className='star'; s.textContent='⭐'; s.dataset.v=i;
    s.onclick=(function(v){return function(){
      selectedStar=v;
      document.getElementById('ratingScore').textContent=v+' / 10';
      document.querySelectorAll('.star').forEach(function(st){st.classList.toggle('on',parseInt(st.dataset.v)<=v);});
    };})(i);
    sc.appendChild(s);
  }
}

function showRating(){document.getElementById('ratingBox').classList.add('show');}

function submitRating(){
  if(ratingSubmitted) return;
  if(selectedStar===0){alert('Baho tanlang!');return;}
  ratingSubmitted=true;
  document.getElementById('ratingThanks').style.display='block';
  document.querySelector('.rating-submit').style.display='none';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
