<script>
var MODULE_INTRO = {
  title: "🤖 14-Modul haqida",
  text: "Bu modulda siz Machine Learning asoslari bilan tanishasiz.\n\nMachine Learning (ML) — kompyuterni ma'lumotlardan o'z-o'zidan o'rganishga o'rgatish fani. An'anaviy dasturlashda qoidalarni o'zingiz yozasiz. ML da esa — kompyuterga ko'p misol ko'rsatasiz va u o'zi qoidalarni topadi.\n\nMavzular: ML turlari (supervised, unsupervised, reinforcement), o'qitish jarayoni, modelni baholash usullari, va sklearn kutubxonasi bilan amaliy mashq.\n\nReal hayotda ML: spam filtrlash (pochta), yuz tanish (telefon), tavsiya tizimi (YouTube, Netflix), narx bashorat (uy narxi), tibbiy tashxis — bularning barchasi ML asosida ishlaydi.",
  count: 6
};

var M = [
{id:'14.1', type:'test',
 title:'Machine Learning nima?',
 terms:[
   ['ML','Ma\'lumotlardan o\'rganib, bashorat qiladigan tizim'],
   ['Model','O\'qitish natijasida olingan matematik funksiya'],
   ['Feature','Kirish ma\'lumoti (x) — model o\'rganadigan belgi'],
   ['Label','Chiqish ma\'lumoti (y) — model bashorat qiladigan javob']
 ],
 detail:'MACHINE LEARNING NIMA VA AN\'ANAVIY DASTURLASHDAN QANDAY FARQ QILADI?\n\nAn\'anaviy dasturlash: Siz qoidalarni yozasiz → kompyuter ma\'lumotni qayta ishlaydi → natija chiqadi.\n\nMachine Learning: Ma\'lumot + kutilgan natija → kompyuter qoidalarni o\'zi topadi → model chiqadi.\n\nAYNAN SHU O\'ZGARISH HAMMA NARSANI O\'ZGARTIRADI. Masalan spam filtrlash: an\'anaviy usulda har qanday yangi spam so\'zini qo\'lda qoidaga qo\'shish kerak. ML da esa — minglab spam va normal xatlarni ko\'rsatasiz, model o\'zi "spam xatlar qanday ko\'rinishda bo\'ladi" ni tushunadi.\n\nML QACHON KERAK? Qoidalar juda murakkab (yuz tanish), qoidalar vaqt o\'tishi bilan o\'zgaradi (narx bashorat), ma\'lumot juda ko\'p va qo\'lda qayta ishlash mumkin emas (Internet ma\'lumotlari).\n\nML QACHON KERAKSIZ? Oddiy hisob-kitob (kalkulyator), aniq qoidalar mavjud (soliq hisoblash), kichik ma\'lumot va sodda mantiq (agar yosh > 18 bo\'lsa, katta deb hisoblash).\n\nMODEL NIMA? ML da "model" — bu o\'qitish jarayonidan chiqqan matematik funksiya. Uy narxini bashorat qiluvchi model: narx = 500*xona_soni + 1000*maydoni - 200*yoshi + ... Koeffitsientlarni model o\'zi topadi.',
 tests:[
   {q:'Machine Learning an\'anaviy dasturlashdan qanday farq qiladi?',
    opts:['Tezroq ishlaydi','Qoidalarni o\'zi topadi, dasturchi yozmaydi','Faqat rasmlar bilan ishlaydi','Internetga ulanishni talab qiladi'],
    ans:1,
    exp:'An\'anaviy dasturlashda dasturchi qoidalarni yozadi. ML da esa kompyuter ma\'lumotlardan o\'rganib, qoidalarni o\'zi topadi.'},
   {q:'ML da "feature" (xususiyat) nima?',
    opts:['Model nomi','Kirish ma\'lumoti — model o\'rganadigan belgi','Chiqish natijasi','O\'qitish vaqti'],
    ans:1,
    exp:'Feature — bu modelga beriladigan kirish ma\'lumoti (x). Masalan uy narxini bashorat qilishda: xonalar soni, maydoni, joylashuvi — bular feature.'},
   {q:'Qaysi holat uchun ML ishlatish to\'g\'ri emas?',
    opts:['Yuz tanish tizimi','Spam filtrlash','2+2 ni hisoblash','Narx bashorat'],
    ans:2,
    exp:'2+2 ni hisoblash uchun ML kerak emas — bu oddiy arifmetika. ML murakkab, ko\'p ma\'lumotli, qoidalar o\'zgarib turadigan masalalar uchun.'},
 ]},

{id:'14.2', type:'test',
 title:'Supervised Learning',
 terms:[
   ['Supervised Learning','Belgilangan (label li) ma\'lumot bilan o\'qitish'],
   ['Classification','Toifalardan birini tanlash (spam/spam emas)'],
   ['Regression','Raqamli qiymat bashorat qilish (narx, temperatura)'],
   ['Training data','Model o\'rganadigan misol ma\'lumotlar']
 ],
 detail:'SUPERVISED LEARNING — ENG KO\'P ISHLATILADIGAN ML TURI\n\nSupervised Learning da har bir misol uchun javob (label) berilgan: "Bu xat — SPAM", "Bu uy narxi — 250,000$". Model ana shu juftliklardan o\'rganadi.\n\n"SUPERVISED" (NAZORATLI) NEGA DEYILADI? Chunki o\'qitish jarayonida har bir misol uchun "to\'g\'ri javob" mavjud — o\'qituvchi kabi nazorat qiluvchi bor.\n\nIKKI ASOSIY TUR:\n1. CLASSIFICATION (Tasniflash): Javob toifalardan biri. Masalan: spam/spam emas, kasallik bor/yo\'q, rasm it/mushuk. Model "qaysi toifaga tegishli" degan savolga javob beradi.\n\n2. REGRESSION (Regressiya): Javob raqamli qiymat. Masalan: uy narxi, harorat, aksiya narxi. Model "qanday qiymat bo\'ladi" degan savolga javob beradi.\n\nREAL MISOLLAR:\n- Classification: Email spam filtri, tibbiy tashxis, kredit berish/bermaslik\n- Regression: Uy narxi bashorati, yo\'l qoidabuzarlik jarima miqdori, talabalar GPA bashorati\n\nMASHHUR ALGORITMLAR:\n- Linear/Logistic Regression — oddiy, tushunish oson\n- Decision Tree — qoidalar daraxti kabi\n- Random Forest — ko\'p daraxt birlashtirilgan\n- SVM — chegaraviy chiziq topish\n- Neural Network — eng kuchli, lekin murakkab',
 tests:[
   {q:'Supervised Learning ning asosiy xususiyati nima?',
    opts:['Javobsiz ma\'lumot bilan o\'rganadi','Har bir misol uchun to\'g\'ri javob (label) berilgan','Faqat rasmlar uchun ishlaydi','Internet kerak'],
    ans:1,
    exp:'Supervised Learning da har bir misol uchun "to\'g\'ri javob" berilgan — model ana shu juftliklardan o\'rganadi.'},
   {q:'"Uy narxini bashorat qilish" qaysi turdagi masala?',
    opts:['Classification','Clustering','Regression','Reinforcement'],
    ans:2,
    exp:'Regression — raqamli qiymat bashorat qilish. Narx son bo\'lgani uchun bu Regression masalasi.'},
   {q:'"Xat spam yoki spam emasligini aniqlash" qaysi turdagi masala?',
    opts:['Regression','Classification','Clustering','Reinforcement'],
    ans:1,
    exp:'Classification — toifalardan birini tanlash. Spam/spam emas — ikki toifa, shuning uchun bu Classification masalasi.'},
 ]},

{id:'14.3', type:'test',
 title:'Unsupervised Learning',
 terms:[
   ['Unsupervised Learning','Belgilanmagan ma\'lumot bilan o\'qitish — model o\'zi naqsh topadi'],
   ['Clustering','Ma\'lumotlarni o\'xshashlik asosida guruhlash'],
   ['K-Means','Eng mashhur clustering algoritmi'],
   ['Dimensionality Reduction','Ko\'p o\'lchovli ma\'lumotni kamaytirish (PCA)']
 ],
 detail:'UNSUPERVISED LEARNING — JAVOBSIZ O\'RGANISH\n\nUnsupervised Learning da ma\'lumotlarda label (javob) yo\'q. Model ma\'lumotlarning o\'zida yashirin naqsh, guruh va tuzilmalarni o\'zi topadi.\n\nNEGA KERAK? Ko\'p holatlarda label yo\'q — masalan, million ta mijozni qo\'lda "bu guruh A, bu guruh B" deb belgilash mumkin emas. Unsupervised Learning o\'zi "o\'xshash mijozlar" ni topadi.\n\nCLUSTERING (KLASTERLASH): Ma\'lumotlarni o\'xshash guruhlarga bo\'lish. Misol: Supermarketda mijozlarni xarid odatiga qarab guruhlash → "tejamkor", "vip", "o\'rta" guruhlar. Buni hech kim oldindan belgilamagan — algoritm o\'zi topgan.\n\nK-MEANS ALGORITMI: Eng oddiy va mashhur clustering. "K" ta markaz belgilab, har bir nuqtani eng yaqin markazga tegishli qiladi, keyin markazlarni qayta hisoblaydi — bu jarayon takrorlanadi.\n\nDIMENSIONALITY REDUCTION: Ko\'p ustunli (o\'lchovli) ma\'lumotni kamroq ustunli ko\'rinishga keltirish — ma\'lumotning asosiy ma\'nosini saqlab. Masalan 100 ta feature ni 2 ta asosiy komponentga keltirish (PCA). Bu visualization uchun yoki ML modelni tezlashtirish uchun ishlatiladi.\n\nSUPERVISED VS UNSUPERVISED:\nSupervised: "Bu rasm it — o\'rgan"\nUnsupervised: "Mana 1000 ta rasm — o\'xshashlarini top"',
 tests:[
   {q:'Unsupervised Learning da nima yo\'q?',
    opts:['Ma\'lumot','Label (belgilangan javob)','Algoritm','Natija'],
    ans:1,
    exp:'Unsupervised Learning da label yo\'q — model ma\'lumotlarda o\'zi naqsh va guruh topadi, hech kim javobni oldindan belgilamagan.'},
   {q:'K-Means qaysi turdagi masala uchun ishlatiladi?',
    opts:['Regression','Classification','Clustering','Dimensionality Reduction'],
    ans:2,
    exp:'K-Means — clustering algoritmi. Ma\'lumotlarni K ta guruhga bo\'ladi.'},
   {q:'Mijozlarni xarid odatiga qarab guruhlash qaysi turdagi masala?',
    opts:['Supervised Regression','Supervised Classification','Unsupervised Clustering','Reinforcement Learning'],

// ═══════ TEST ═══════
function renderTest(m){
  if(!testAnswers[cur]) testAnswers[cur]={};
  var h='<div class="test-panel"><div class="test-title">🧠 '+m.title+' — Test</div>';
  m.tests.forEach(function(t,qi){
    h+='<div class="test-q" id="tq'+qi+'">';
    h+='<div class="test-qtext">'+(qi+1)+'. '+esc(t.q)+'</div>';
    h+='<div class="test-opts">';
    var answered = testAnswers[cur][qi] !== undefined;
    t.opts.forEach(function(o,oi){
      var cls='test-opt';
      if(answered){
        if(oi===t.ans) cls+=' show-correct';
        else if(oi===testAnswers[cur][qi] && oi!==t.ans) cls+=' wrong';
      }
      h+='<button class="'+cls+'" onclick="answerTest('+qi+','+oi+')" '+(answered?'disabled':'')+'>'+esc(o)+'</button>';
    });
    h+='</div>';
    if(answered){
      var isCorrect = testAnswers[cur][qi]===t.ans;
      h+='<div class="test-exp show">'+(isCorrect?'✅':'❌')+' '+esc(t.exp)+'</div>';
    }
    h+='</div>';
  });
  // score
  var answered=Object.keys(testAnswers[cur]).length;
  var correct=0;
  Object.keys(testAnswers[cur]).forEach(function(qi){
    if(testAnswers[cur][qi]===m.tests[qi].ans) correct++;
  });
  if(answered===m.tests.length){
    h+='<div class="test-score show">Natija: '+correct+'/'+m.tests.length+' ✅</div>';
    doneSet.add(cur);
  }
  h+='</div>';
  document.getElementById('mainContent').innerHTML=h;
  document.getElementById('result-panel') && document.getElementById('result-panel').classList.remove('show');
  updateTopStats();
}

function answerTest(qi,oi){
  if(!testAnswers[cur]) testAnswers[cur]={};
  if(testAnswers[cur][qi]!==undefined) return;
  testAnswers[cur][qi]=oi;
  renderTest(M[cur]);
  buildTabs(); updateTopStats();
}

  var dotsH='<div style="display:flex;gap:6px;justify-content:center;margin-bottom:10px;">';

  });
  dotsH+='</div>';
  // question
  var qH='<div style="background:#0d1828;border:1px solid #1e3048;border-left:3px solid #a855f7;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:.71rem;line-height:1.8;color:#c4b5fd;white-space:pre-wrap;">Eskiz '+(curEskiz+1)+'/'+m.eskizlar.length+' — '+esc(e.q)+'</div>';

  var resH='<div class="result-panel" id="resultPanel"><div class="result-title">📊 NATIJA — SIMULYATSIYA</div><div class="sim-wrap" id="simWrap"></div></div>';
  // code block
  var codeH='<div class="code-block"><div class="fbar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><div class="fn" id="fname">ml_14_'+(curEskiz+1)+'.py</div><div class="fhint">↔️ suring ✏️ yozing</div></div><div class="lines-wrap" id="linesWrap"></div><div class="btn-row"><button class="btn btn-chk" onclick="doCheck()">✅ Tekshir</button><button class="btn btn-clr" onclick="doClear()">🗑️ Tozala</button><button class="btn btn-ghost" id="ghostBtn" onclick="toggleGhost()">👁️ Yashir</button><button class="btn btn-det" onclick="toggleDetail()">📖 Batafsil</button><button class="btn btn-res" onclick="toggleResult()">📊 Natija</button></div><div class="badge" id="badge"></div></div>';
  document.getElementById('mainContent').innerHTML=dotsH+qH+skipH+resH+codeH;
  buildLines(e);
  // sync skip sw
  document.getElementById('sw').classList.toggle('on',skipOn);
  document.getElementById('skipLbl').textContent=skipOn?'Kommentlar o\'tkazilmoqda':'# Kommentlarni o\'tkazib yuboring';

function jumpEskiz(i){ curEskiz=i; renderEskiz(M[cur]); }

function buildLines(e){
  var wrap=document.getElementById('linesWrap');
  if(!wrap) return;
  wrap.innerHTML=''; lineData=[];
  var op=BRIGHT[parseInt(document.getElementById('brightSlider').value)||3];
  e.lines.forEach(function(ln,i){
    var isCom=ln.c.replace(/^\s+/,'').charAt(0)==='#';
    var isEmpty=ln.c==='';
    var isSlash=ln.c.endsWith('\\');
    var block=document.createElement('div');
    block.className='line-block';
    var row=document.createElement('div');
    row.className='line-row';
    var num=document.createElement('div');
    num.className='line-num'; num.id='num'+i;
    num.textContent=isEmpty?'':(i+1);
    var content=document.createElement('div');
    content.className='line-content';
    var ghost=document.createElement('div');
    ghost.className='line-ghost'+((isCom&&skipOn)?' skip-c':'');
    ghost.id='ghost'+i;
    ghost.style.color=ghostVisible?'rgba(74,96,128,'+op+')':'transparent';
    ghost.textContent=ln.c||' ';
    var colors=document.createElement('div');
    colors.className='line-colors'; colors.id='clr'+i;
    var inp=document.createElement('input');
    inp.type='text'; inp.className='line-input'; inp.id='inp'+i;
    inp.setAttribute('spellcheck','false'); inp.setAttribute('autocorrect','off');
    inp.setAttribute('autocapitalize','off'); inp.setAttribute('autocomplete','off');
    if(isEmpty||(isCom&&skipOn)) inp.disabled=true;
    (function(idx,target,noteText){
      inp.addEventListener('input',function(){
        if(!target) return;
        updateLineClr(idx,target);
        if(inp.value===target&&target!==''&&noteText!=='') showNote(idx);
        else if(inp.value!==target) hideNote(idx);
        updateStats();
      });
    })(i,ln.c,ln.n);
    content.appendChild(ghost); content.appendChild(colors); content.appendChild(inp);
    row.appendChild(num); row.appendChild(content);
    var note=document.createElement('div');
    note.className='line-done-note'; note.id='note'+i;
    note.textContent=ln.n?('✅ '+ln.n+'!'):'';
    block.appendChild(row);
    if(ln.n) block.appendChild(note);
    wrap.appendChild(block);
    lineData.push({inp:inp,target:ln.c,isCom:isCom,isEmpty:isEmpty});
  });
}

function updateLineClr(idx,target){
  var inp=document.getElementById('inp'+idx);
  var clr=document.getElementById('clr'+idx);
  if(!inp||!clr) return;
  var typed=inp.value, html='';
  for(var ci=0;ci<target.length;ci++){
    var ch=target[ci];
    if(ci<typed.length) html+=typed[ci]===ch?'<span style="color:#22c55e">'+esc(ch)+'</span>':'<span style="color:#f43f5e;text-decoration:underline">'+esc(ch)+'</span>';
    else html+='<span style="color:transparent">'+esc(ch)+'</span>';
  }
  clr.innerHTML=html;
  var num=document.getElementById('num'+idx);
  if(num) num.style.color=(typed===target&&target!=='')?'#22c55e':'';
}

function showNote(i){var n=document.getElementById('note'+i);if(n&&n.textContent)n.classList.add('show');}
function hideNote(i){var n=document.getElementById('note'+i);if(n)n.classList.remove('show');}

function doCheck(){
  var e=M[cur].eskizlar[curEskiz];
  var done=0,total=0,errors=[];
  lineData.forEach(function(l,i){
    if(l.isEmpty||(l.isCom&&skipOn)) return;
    total++;
    if(l.inp.value===l.target){
      done++; document.getElementById('num'+i).style.color='#22c55e';
      if(e.lines[i].n) showNote(i);
    } else {
      errors.push(i+1); document.getElementById('num'+i).style.color='#f43f5e';
    }
  });
  var pct=total>0?Math.round(done/total*100):0;
  var b=document.getElementById('badge');
  if(!b) return;
  b.className='badge show';
  if(pct>=85){
    b.className+=' g';
    eskizDoneSet.add(cur+'-'+curEskiz);
    var isLast=curEskiz===M[cur].eskizlar.length-1;
    if(isLast){ doneSet.add(cur); b.textContent='✅ Zo\'r! '+pct+'% — barcha eskizlar tugadi!'; showRating(); }
    else { b.textContent='✅ Zo\'r! '+pct+'% — keyingi eskiz →'; setTimeout(function(){curEskiz++;renderEskiz(M[cur]);},900); }
  } else if(pct>=55){
    b.className+=' o'; b.textContent='⚡ '+pct+'% — xato qatorlar: '+errors.join(', ')+'-qator';
  } else {
    b.className+=' r'; b.textContent='❌ '+pct+'% — qaytadan urinib ko\'ring';
  }
  updateStats(); buildTabs();
}

function doClear(){
  lineData.forEach(function(l,i){
    l.inp.value='';
    var clr=document.getElementById('clr'+i); if(clr) clr.innerHTML='';
    var num=document.getElementById('num'+i); if(num) num.style.color='';
    hideNote(i);
  });
  var b=document.getElementById('badge'); if(b) b.className='badge';
  updateStats();
}

function updateStats(){
  if(M[cur].type!=='eskiz') return;
  var done=0,total=0;
  lineData.forEach(function(l){
    if(l.isEmpty||(l.isCom&&skipOn)) return;
    total++;
    if(l.inp.value===l.target) done++;
  });
  var pct=total>0?Math.round(done/total*100):0;
  document.getElementById('svDone').textContent=done+'/'+total;
  document.getElementById('svScore').textContent=done>0?pct+'%':'—';
  document.getElementById('progressFill').style.width=(doneSet.size/M.length*100)+'%';
}

function updateTopStats(){
  // test balini hisoblash
  var totalQ=0, correctQ=0;
  M.forEach(function(m,mi){
    if(m.type!=='test') return;
    m.tests.forEach(function(t,qi){
      totalQ++;
      if(testAnswers[mi]&&testAnswers[mi][qi]===t.ans) correctQ++;
    });
  });
  document.getElementById('svScore').textContent=totalQ>0?(correctQ+'/'+totalQ):'—';
  document.getElementById('svDone').textContent=doneSet.size+'/'+M.length;
  document.getElementById('progressFill').style.width=(doneSet.size/M.length*100)+'%';
}

function toggleGhost(){
  ghostVisible=!ghostVisible;
  document.querySelectorAll('.line-ghost').forEach(function(g){g.style.visibility=ghostVisible?'visible':'hidden';});
  var gb=document.getElementById('ghostBtn');
  if(gb) gb.textContent=ghostVisible?'👁️ Yashir':'👁️ Ko\'rsat';
}

function toggleSkip(){
  skipOn=!skipOn;
  var sw=document.getElementById('sw'); if(sw) sw.classList.toggle('on',skipOn);
  var sl=document.getElementById('skipLbl'); if(sl) sl.textContent=skipOn?'Kommentlar o\'tkazilmoqda':'# Kommentlarni o\'tkazib yuboring';
  if(M[cur].type==='eskiz'){ buildLines(M[cur].eskizlar[curEskiz]); applyBright(); updateStats(); }
}

function toggleDetail(){
  var p=document.getElementById('detailPanel');
  if(p.classList.contains('show')){p.classList.remove('show');}
  else{document.getElementById('detailContent').textContent=M[cur].detail;p.classList.add('show');}
}

function toggleResult(){
  var p=document.getElementById('resultPanel');
  if(!p) return;
  if(p.classList.contains('show')){p.classList.remove('show');}
  else{document.getElementById('simWrap').innerHTML='<pre>'+esc(M[cur].sim)+'</pre>';p.classList.add('show');}
}

function setBright(v){document.getElementById('brightVal').textContent=v;applyBright();}

function applyBright(){
  var v=parseInt(document.getElementById('brightSlider').value)||3;
  var op=BRIGHT[v];
  document.querySelectorAll('.line-ghost').forEach(function(g){
    if(!g.classList.contains('skip-c')&&ghostVisible) g.style.color='rgba(74,96,128,'+op+')';
  });
}

function buildTabs(){
  var c=document.getElementById('tabs'); c.innerHTML='';
  M.forEach(function(m,i){
    var d=document.createElement('div');
    d.className='tab'+(i===cur?' on':'')+(doneSet.has(i)?' done':'');
    d.textContent=m.id;
    d.onclick=(function(n){return function(){loadMod(n);};})(i);
    c.appendChild(d);
  });
}

function buildStars(){
  var sc=document.getElementById('stars'); sc.innerHTML='';
  for(var i=1;i<=10;i++){
    var s=document.createElement('span');
    s.className='star'; s.textContent='⭐'; s.dataset.v=i;
    s.onclick=(function(v){return function(){
      selectedStar=v;
      document.getElementById('ratingScore').textContent=v+' / 10';
      document.querySelectorAll('.star').forEach(function(st){st.classList.toggle('on',parseInt(st.dataset.v)<=v);});
    };})(i);
    sc.appendChild(s);
  }
}

function showRating(){document.getElementById('ratingBox').classList.add('show');}

function submitRating(){
  if(ratingSubmitted) return;
  if(selectedStar===0){alert('Baho tanlang!');return;}
  ratingSubmitted=true;
  document.getElementById('ratingThanks').style.display='block';
  document.querySelector('.rating-submit').style.display='none';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
